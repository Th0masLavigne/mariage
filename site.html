<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tiphaine &amp; Thomas · Le carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&display=swap">

  SITE PRATIQUE — ne pas modifier ici : tout se règle dans config.js (bloc « site »).

<style>
/* ---------- Couleurs (mêmes palettes que le faire-part) ---------- */
:root {
  --paper: #f3ede2; --paper-2: #ebe3d4; --card: #fdfaf3; --ink: #2b2b3b; --muted: #7a7585; --line: #e2d9c8;
  --accent: #4a63b0; --blue: #4a63b0; --blue-d: #34498c; --blue-soft: #dfe5f4;
  --rose: #c0607f; --rose-soft: #f3d9e1; --gold: #b48a3c;
  --accent-rgb: 74,99,176; --soft-rgb: 223,229,244; --tape-rgb: 127,151,216; --shade-rgb: 30,40,90;
  --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --f-body: 'EB Garamond', 'Garamond', Georgia, serif;
  --f-mono: 'EB Garamond', 'Garamond', Georgia, serif;
  --r: 6px;
  --f-hand: 'Parisienne', 'Snell Roundhand', 'Apple Chancery', cursive;
  --noise: url("photos/grain-carte.png") 0 0 / 200px 200px;
  color-scheme: light;
}
:root[data-palette="vieux-rose"] {
  --paper: #f4ebe5; --paper-2: #ecdcd4; --card: #fefaf6; --ink: #3a2e33; --muted: #85767b; --line: #e8d6cd;
  --accent: #9a5866; --blue: #9a5866; --blue-d: #7a4250; --blue-soft: #f2e2df;
  --rose: #a97a4c; --rose-soft: #f3e3d8;
  --accent-rgb: 154,88,102; --soft-rgb: 242,226,223; --tape-rgb: 214,170,160; --shade-rgb: 90,45,55;
}
:root[data-palette="bridgerton"] {
  --paper: #f5f0e8; --paper-2: #ebe3d6; --card: #fffdf8; --ink: #2b3150; --muted: #77768a; --line: #e4dac9;
  --accent: #4a6a9c; --blue: #4a6a9c; --blue-d: #364f7c; --blue-soft: #e3eaf5;
  --rose: #a8789a; --rose-soft: #efe4ef; --gold: #b48a3c;
  --accent-rgb: 74,106,156; --soft-rgb: 227,234,245; --tape-rgb: 183,163,211; --shade-rgb: 40,50,80;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; color: var(--ink); font: 18px/1.6 var(--f-body); background-color: var(--paper);
  background-image: radial-gradient(120% 90% at 50% 30%, var(--card) 0%, var(--paper) 60%, var(--paper-2) 100%), url("photos/grain-fond.png");
  background-size: auto, 220px 220px;
}
img { max-width: 100%; display: block; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed var(--rose); outline-offset: 3px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }
.eyebrow { font: 500 12.5px/1.2 var(--f-body); letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }
h2 { font: italic 400 clamp(32px, 6.4vw, 46px)/1.08 var(--f-display); margin: 10px 0 24px; text-wrap: balance; color: var(--blue); }
h3 { font: 600 23px/1.15 var(--f-display); margin: 0; }
section { padding-top: 30px; text-align: center; }
section > .paper:not(.carte):not(.stay):not(.dc), section > .grid, section > .faq { text-align: left; }
section > .grid.places { text-align: center; }
.rule { display: block; width: min(240px, 70%); height: auto; margin: 46px auto 0; color: var(--gold); }
.muted { color: var(--muted); }
.soon {
  display: inline-block; font: 500 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase;
  color: var(--rose); border: 1.5px solid currentColor; border-radius: 99px; padding: 5px 9px 4px;
}
.lead { max-width: 52ch; margin: 0 auto 22px; color: #55516a; text-wrap: balance; }

/* ---------- Bandeau d’annonce ---------- */
.annonce {
  position: relative; z-index: 30; padding: 10px 20px; text-align: center; color: #fff;
  font: italic 400 17px/1.35 var(--f-display);
  background: linear-gradient(100deg, #8a6424, #c9a24a 30%, #e9cd84 50%, #c9a24a 70%, #8a6424);
}

/* ---------- Papier déchiré (filtres #torn de sketches.js) ---------- */
.paper { position: relative; isolation: isolate; padding: 30px 24px 26px; transform: rotate(var(--tilt, 0deg)); }
.paper::before, .cd div::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--card) var(--noise);
  /* bords déchirés : même masque image que le faire-part (fluide sur iPhone) */
  -webkit-mask-box-image: url("photos/bord-papier.png") 48 fill / 34px round; mask-border: url("photos/bord-papier.png") 48 fill / 34px round; }
.paper { box-shadow: 0 16px 26px -14px rgba(50,45,70,.26), 0 3px 5px -3px rgba(50,45,70,.14); }
.paper > .in-border { position: absolute; inset: 12px; border: 1px solid var(--line); pointer-events: none; }
.fili { position: absolute; width: clamp(48px, 13vw, 70px); pointer-events: none; z-index: 1; opacity: .95; }
.fili.tl { left: 6px; top: 6px; } .fili.tr { right: 6px; top: 6px; transform: scaleX(-1); }
.fili.bl { left: 6px; bottom: 6px; transform: scaleY(-1); } .fili.br { right: 6px; bottom: 6px; transform: scale(-1, -1); }

/* ---------- En-tête ---------- */
.hero { padding-top: max(48px, env(safe-area-inset-top, 0px)); text-align: center; }
.hero-card { max-width: 520px; margin: 0 auto; padding: 42px 26px 36px; --tilt: -.6deg; }
.coin { position: absolute; left: -30px; top: -36px; width: clamp(130px, 40vw, 200px); pointer-events: none; z-index: 2; }
.coin img { width: 100%; filter: drop-shadow(0 6px 8px rgba(var(--shade-rgb),.16)); }
.emboss { position: absolute; left: 50%; top: 54%; width: 88%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: -1; opacity: .9; }
.emboss i { position: absolute; inset: 0; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.emboss .e1 { background: rgba(255,255,255,.95); transform: translate(-1.4px, -1.4px); }
.emboss .e2 { background: rgba(110,90,60,.16); transform: translate(1.4px, 1.6px); }
.emboss .e3 { background: var(--card); }
.seal { width: 54px; margin: 0 auto 12px; transform: rotate(-8deg); }
.seal img, .seal svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 4px rgba(90,60,15,.35)); }
.hero-art { margin: 14px auto 4px; max-width: 360px; }
.hero-art img { width: 100%; height: auto; }
.hero-art.mono img { width: min(230px, 60vw); margin: 0 auto; }
.hero-art.photo { width: min(70%, 260px); padding: 7px; border: 1px solid var(--line); border-radius: 50%; background: var(--card); box-shadow: 0 0 0 3px rgba(180,138,60,.35); }
.hero-art.photo img { aspect-ratio: 4/5; object-fit: cover; border-radius: 50%; }
.names { font: 400 clamp(52px, 14vw, 84px)/1 var(--f-hand); margin: 10px 0 0; font-weight: 400; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both .2s; }
.names .amp { font-size: .62em; color: var(--rose); margin: 0 .12em; }
.dates { font: 500 clamp(13px, 3.4vw, 15px)/1.3 var(--f-display); letter-spacing: .3em; text-transform: uppercase; margin: 14px 0 0; color: var(--blue); }
.formule { margin: 8px 0 0; font: italic 400 16px/1.3 var(--f-body); color: var(--muted); }
.intro { max-width: 46ch; margin: 34px auto 0; font: italic 400 clamp(19px, 3.8vw, 22px)/1.5 var(--f-display); color: #4f4b5c; text-wrap: balance; }
.generic { max-width: 44ch; margin: 14px auto 0; font-size: 15.5px; color: var(--muted); font-style: italic; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* compte à rebours compact */
.cd { display: flex; justify-content: center; gap: 10px; margin: 30px auto 0; }
.cd div { position: relative; isolation: isolate; min-width: 70px; padding: 12px 6px 9px; }
.cd div { box-shadow: 0 8px 12px -8px rgba(50,45,70,.22); }
.cd b { display: block; font: 400 clamp(26px, 7vw, 36px)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.cd span { display: block; margin-top: 5px; font: 500 10px/1 var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.cd-lbl { margin-top: 14px; font: italic 400 17px/1.3 var(--f-body); color: var(--muted); }

/* statut de réponse */
.statut { max-width: 460px; margin: 30px auto 0; padding: 22px 22px 20px; text-align: center; --tilt: .4deg; }
.statut .big { font: 400 30px/1.1 var(--f-hand); color: var(--rose); }
.statut p { margin: 6px 0 0; font-size: 16px; color: #55516a; }

/* boutons */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 14px; padding: 12px 22px; border-radius: 99px; border: 0; cursor: pointer; text-decoration: none;
  background: var(--accent); color: #fff; font: 500 12.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase;
  box-shadow: 0 8px 18px rgba(var(--accent-rgb),.22);
}
.btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255,240,200,.7), transparent); transform: skewX(-20deg); transition: left .7s ease; }
.btn:hover::after { left: 120%; }
.btn.ghost { background: rgba(255,255,255,.7); color: var(--accent); border: 1.5px solid var(--line); box-shadow: none; }
.btn[disabled] { opacity: .55; cursor: default; }
.btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; }
.btn svg { width: 15px; height: 15px; }

/* ---------- Sommaire collant ---------- */
.toc { position: sticky; top: 0; z-index: 20; margin: 40px -20px 0; padding: 0 12px; background: rgba(255,253,248,.86); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-block: 1px solid var(--line); }
.toc ul { list-style: none; display: flex; gap: 4px; margin: 0; padding: 0; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
.toc ul::-webkit-scrollbar { display: none; }
.toc a { display: block; padding: 14px 10px 12px; white-space: nowrap; text-decoration: none; color: var(--muted); font: 500 11.5px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; border-bottom: 2px solid transparent; }
.toc a.on { color: var(--ink); border-bottom-color: var(--gold); }

/* ---------- Programme ---------- */
.day + .day { margin-top: 30px; }
.day-h { font: 500 13px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 12px; }
.day-h::after { content: ''; flex: 1; border-top: 1.5px dashed var(--line); }
.moment { display: grid; grid-template-columns: 58px 1fr; gap: 16px; align-items: start; padding-top: 16px; }
.moment .ico { width: 58px; height: 58px; object-fit: contain; }
.moment .ico svg { width: 58px; height: 58px; }
.moment h3 { font: italic 400 25px/1.15 var(--f-display); color: var(--blue); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 15.5px; }
.time { font: 600 15px/1 var(--f-display); color: var(--rose); letter-spacing: .06em; }
.moment p { margin: 6px 0 0; color: var(--muted); font-size: 16.5px; }

/* ---------- Lieux ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px; margin-top: 34px; }
.place { text-align: center; }
.place .art { height: 150px; display: grid; place-items: center; }
.place .art img { max-height: 150px; width: auto; }
.place h3 { margin-top: 12px; }
.addr { color: var(--muted); font-size: 15px; }
.links { display: flex; justify-content: center; gap: 14px; margin-top: 8px; font: 500 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; }

/* lignes d’infos (venir, contacts) */
.infos { list-style: none; margin: 0; padding: 0; }
.infos li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px dashed var(--line); }
.infos li:first-child { border-top: 0; padding-top: 4px; }
.infos .i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); color: var(--blue); }
.infos .i svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.infos b { display: block; font: 600 13px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); margin-bottom: 3px; }
.infos p { margin: 0; color: #55516a; font-size: 16.5px; }

/* hébergement */
.stay { text-align: center; }
.stay .ico { width: 96px; height: 96px; margin: 0 auto 6px; object-fit: contain; }
.prix { font: italic 400 30px/1 var(--f-display); color: var(--blue); margin-top: 10px; }
.prix small { display: block; margin-top: 4px; font: 500 11px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.note { font-style: italic; color: var(--muted); font-size: 15.5px; }
.adr { padding: 22px 20px 20px; }
.adr .type { font: 500 11px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.adr h3 { margin-top: 6px; font-size: 21px; }
.adr p { margin: 6px 0 0; font-size: 16px; color: #55516a; }

/* dress code : dresscode.css (partagé avec le faire-part) */
#dress-code .dc-card { max-width: 440px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
.chut { font: 400 40px/1 var(--f-hand); color: var(--rose); }

/* covoiturage */
.covoit { margin-top: 34px; text-align: center; }
.cv-head { display: flex; justify-content: center; align-items: center; gap: 12px; }
.cv-head .i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); color: var(--blue); }
.cv-head svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.cv-list { display: grid; gap: 10px; text-align: left; }
.cv { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.65); }
.cv-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.cv .tag { font: 500 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px 4px; border-radius: 99px; color: #fff; background: var(--blue); }
.cv .tag.cherche { background: var(--rose); }
.cv b { font: italic 400 19px/1.2 var(--f-display); }
.cv .meta2 { font-size: 15px; color: var(--muted); }
.cv .contact { font-size: 15.5px; user-select: all; }
.cv .retirer { justify-self: start; background: none; border: 0; padding: 0; margin-top: 2px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { flex: 1 1 160px; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; text-align: center; font: 500 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; background: rgba(255,255,255,.6); }
.seg input:checked + span { border-color: var(--accent); color: var(--accent); background: rgba(var(--soft-rgb),.6); }
.seg input:focus-visible + span { outline: 2px dashed var(--rose); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 7em; gap: 10px; }
[hidden] { display: none !important; }
.form select, .form input[type=number] { font-size: 16px; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.8); }

/* FAQ */
.faq { max-width: 620px; margin: 0 auto; }
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 18px 2px; font: italic 400 21px/1.3 var(--f-display); color: var(--ink); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; font: 400 26px/1 var(--f-display); color: var(--gold); transition: transform .3s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { margin: 0 2px 18px; color: #55516a; }

/* liste, témoins, playlist, merci : cartes centrées */
.carte { max-width: 520px; margin: 0 auto; text-align: center; }
.carte.fil { padding: 44px 40px 38px; }
.carte .ico { width: 84px; height: 84px; margin: 0 auto 6px; object-fit: contain; }
.accroche { font: italic 400 23px/1.35 var(--f-display); color: var(--ink); text-wrap: balance; margin: 0; }
.temoin { padding: 22px 18px 20px; text-align: center; }
.temoin .role { font: 400 22px/1 var(--f-hand); color: var(--rose); }
.temoin .links { flex-wrap: wrap; }

/* formulaires */
.form { display: grid; gap: 12px; max-width: 420px; margin: 18px auto 0; text-align: left; }
.form label { font: 500 11.5px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.form input[type=text] { font-size: 16px;  width: 100%; margin-top: 6px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.8); }
.form input:focus { outline: 0; border-color: var(--accent); }
.form .btn { justify-self: center; }
.msg { min-height: 1.4em; margin: 8px 0 0; font-size: 15.5px; font-style: italic; color: var(--rose); text-align: center; }
.hp { position: absolute; left: -9999px; }

/* dépôt de photos */
.form .drop { font: 400 15px/1.4 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.drop { position: relative; display: grid; place-items: center; gap: 6px; margin-top: 6px; padding: 26px 16px; border: 1.5px dashed var(--gold); border-radius: 14px; background: rgba(255,255,255,.55); cursor: pointer; text-align: center; transition: background .2s; }
.drop:hover, .drop.over { background: rgba(var(--soft-rgb),.6); }
.drop b { font: italic 400 22px/1.2 var(--f-display); color: var(--blue); }
.drop span { font-size: 14.5px; color: var(--muted); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.bar { height: 6px; border-radius: 6px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #e9cd84); transition: width .3s; }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14.5px; }
.files li { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); }
.files li .ok { color: #5b8a5a; } .files li .ko { color: var(--rose); }

/* pied de page */
footer { text-align: center; padding-top: 56px; }
footer .seal { width: 60px; transform: rotate(6deg); }
footer .sig { font: 400 40px/1.1 var(--f-hand); margin-top: 6px; }
footer .links { margin-top: 18px; flex-wrap: wrap; }

/* apparition douce au défilement */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .names { animation: none; } html { scroll-behavior: auto; } }
@media (max-width: 480px) { body { font-size: 17px; } .paper { padding: 26px 20px 22px; } .cd div { min-width: 0; flex: 1; } .toc { margin-inline: -20px; } }
</style>
</head>
<body>
<div id="annonce"></div>
<div class="wrap" id="app"></div>

<script src="config.js"></script>
<script src="sketches.js"></script>
<script src="dresscode.js"></script>
<script src="typo.js"></script>
<script>
'use strict';
(function () {
  const C = window.CONFIG, S = window.SKETCH, SI = C.site || {};
  const $ = (s, el = document) => el.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('fp.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('fp.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const params = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(); } })();
  const TOUT = params.has('tout');
  const BACKEND = C.rsvpUrl || '';

  /* ---------- quelle formule ? lien ?f=…, sinon celle déjà vue sur ce téléphone, sinon la partie commune ---------- */
  const valid = k => k && C.formules[k];
  let code = params.get('f'), perso = true;
  if (valid(code)) store.set('code', code);
  else if (valid(store.get('code'))) code = store.get('code');
  else { perso = false; code = valid(SI.formuleParDefaut) ? SI.formuleParDefaut : Object.keys(C.formules).pop(); }
  const F = C.formules[code];
  const nom = params.get('n') || '';
  const lienFP = './?f=' + encodeURIComponent(code) + (nom ? '&n=' + encodeURIComponent(nom) : '');

  /* ---------- palette, retouches, filigrane (comme le faire-part) ---------- */
  const root = document.documentElement, PAL = C.palette || 'bridgerton';
  if (PAL !== 'bleu') root.dataset.palette = PAL;
  const TOK = { fond: ['--paper'], fond2: ['--paper-2'], papier: ['--card'], texte: ['--ink'], texteDoux: ['--muted'], filets: ['--line'],
    titres: ['--accent', '--blue'], titresFonce: ['--blue-d'], titresClair: ['--blue-soft'], accent: ['--rose'], or: ['--gold'] };
  const CO = C.couleurs || {};
  Object.keys(CO).forEach(k => (TOK[k] || []).forEach(t => root.style.setProperty(t, CO[k])));
  if (C.filigrane !== false && C.monogrammeLettres) {
    const im = new Image();
    im.onload = () => { try {
      const k = 2, W = 120 * k, Hh = 168 * k, cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
      const g = cv.getContext('2d'), w = 92 * k, h = w * im.height / im.width;
      [[0, 0], [W, 0], [0, Hh], [W, Hh], [W / 2, Hh / 2]].forEach(([x, y]) => { g.save(); g.translate(x, y); g.rotate(-8 * Math.PI / 180); g.drawImage(im, -w / 2, -h / 2, w, h); g.restore(); });
      g.globalCompositeOperation = 'source-in'; g.fillStyle = getComputedStyle(root).getPropertyValue('--accent').trim() || '#4a6a9c'; g.fillRect(0, 0, W, Hh);
      const t = document.createElement('canvas'); t.width = W; t.height = Hh; const g2 = t.getContext('2d'); g2.globalAlpha = .06; g2.drawImage(cv, 0, 0);
      const bs = getComputedStyle(document.body);
      document.body.style.backgroundImage = `url(${t.toDataURL('image/png')}), ` + bs.backgroundImage;
      document.body.style.backgroundSize = '120px 168px, ' + bs.backgroundSize;
    } catch (e) {} };
    im.src = C.monogrammeLettres;
  }
  document.body.insertAdjacentHTML('afterbegin', S.defs + S.pageDefs);

  /* ---------- petits outils ---------- */
  const JOUR_J = new Date(C.dateMariage + 'T00:00:00+02:00');
  const on = sec => { if (!sec) return false; if (TOUT) return true; const a = sec.actif; return a === 'jour-j' ? Date.now() >= JOUR_J : !!a; };
  const soon = t => `<span class="soon">${esc(t || 'bientôt')}</span>`;
  const rule = () => C.palette === 'bleu' ? '<svg class="rule" viewBox="0 0 120 18" aria-hidden="true"><path d="M4 9 H46 M74 9 H116" stroke="currentColor" stroke-width=".8"/><path d="M60 3 L64 9 L60 15 L56 9 Z" fill="currentColor"/></svg>' : S.ornement();
  const ICONES = ['rings', 'moon', 'bells', 'glasses', 'plate', 'croissant', 'window', 'gift'];
  const ico = k => C.icones !== false && ICONES.includes(k) ? `<img class="ico" src="photos/icones/${k}.webp" alt="">` : `<span class="ico">${k === 'window' ? S.fenetre() : S.doodle(k)}</span>`;
  const seal = where => { const m = (C.sceaux || {})[where]; return m === 'photo' && C.sceauImage ? `<img src="${esc(C.sceauImage)}" alt="">` : S.seal(C.monogramme, C.cachet || 'or', /^image/.test(m || 'image') ? C.monogrammeLettres : '', /couronne|^dessin/.test(m || '')); };
  const fili = () => C.filigranesCoins !== false ? ['tl', 'tr', 'bl', 'br'].map(c => `<span class="fili ${c}">${S.filigrane()}</span>`).join('') : '';
  const ext = (href, txt) => `<a href="${esc(href)}" target="_blank" rel="noopener">${txt}</a>`;
  const head = (eye, titre) => `<div class="eyebrow">${esc(eye)}</div><h2>${esc(titre)}</h2>`;
  const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  /* pictos au trait (rubrique « Venir », contacts) */
  const PICTO = {
    voiture: '<path d="M4 15 L5.5 9.5 Q6 8 7.6 8 H16.4 Q18 8 18.5 9.5 L20 15 V18 H4 Z M4 15 H20 M7 18 V20 M17 18 V20"/><circle cx="7.5" cy="15" r=".6"/><circle cx="16.5" cy="15" r=".6"/>',
    parking: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 16 V8 H13 Q15.5 8 15.5 10.5 Q15.5 13 13 13 H10"/>',
    train: '<rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10 H18 M9 20 L10.5 16.5 M15 20 L13.5 16.5"/><circle cx="9" cy="13.5" r=".6"/><circle cx="15" cy="13.5" r=".6"/>',
    navette: '<rect x="3.5" y="6" width="17" height="11" rx="2.5"/><path d="M3.5 11 H20.5 M8 6 V11 M13 6 V11"/><circle cx="7.5" cy="18" r="1.4"/><circle cx="16.5" cy="18" r="1.4"/>',
    covoiturage: '<circle cx="8" cy="8" r="2.6"/><circle cx="16" cy="8" r="2.6"/><path d="M3.5 19 Q4 13 8 13 Q12 13 12.5 19 M11.5 19 Q12 13 16 13 Q20 13 20.5 19"/>',
    tel: '<path d="M6 4 H9 L10.5 8 L8.5 9.5 Q10 13 14.5 15.5 L16 13.5 L20 15 V18 Q20 20 18 20 Q5 19 4 6 Q4 4 6 4 Z"/>',
    mail: '<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M4 7 L12 13 L20 7"/>'
  };
  const picto = k => `<span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">${PICTO[k]}</svg></span>`;

  /* ---------- envoi vers l’Apps Script (réponse lisible : en-tête text/plain) ---------- */
  async function post(obj) {
    const url = (SI.photos && SI.photos.url) || BACKEND;
    if (!url || params.has('demo')) { await new Promise(r => setTimeout(r, 600)); return { ok: true, demo: true }; }
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) });
    return r.json();
  }

  /* =====================================================================
     SECTIONS — chacune : { id, menu, html }
     ===================================================================== */
  const days = [];
  F.moments.forEach(k => { const m = C.moments[k]; let d = days.find(x => x.jour === m.jour); if (!d) days.push(d = { jour: m.jour, items: [] }); d.items.push(k); });
  const lieuxUsed = ['mairie', 'eglise', 'chateau'].filter(k => F.moments.some(m => C.moments[m].lieu === k));
  const DC = C.dressCode || {};
  const H = C.hebergement || {};
  const sections = [];

  function gcal() {
    const ds = F.moments.map(k => parseInt(C.moments[k].jour.replace(/\D+/g, ' ').trim(), 10)), d0 = new Date(C.dateMariage + 'T12:00:00');
    const ymd = d => `${d0.getFullYear()}${String(d0.getMonth() + 1).padStart(2, '0')}${String(d).padStart(2, '0')}`;
    const L = C.lieux.chateau;
    const q = new URLSearchParams({ action: 'TEMPLATE', text: `Mariage de ${C.prenoms[0]} & ${C.prenoms[1]}`,
      dates: `${ymd(Math.min(...ds))}/${ymd(Math.max(...ds) + 1)}`,
      details: F.moments.map(k => { const m = C.moments[k]; return `${m.jour}${m.heure ? ' ' + m.heure : ''} : ${m.titre} (${C.lieux[m.lieu].nom})`; }).join('\n'),
      location: `${L.nom}, ${L.adresse}` });
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  }

  /* --- Programme + lieux --- */
  if (on(SI.programme)) sections.push({ id: 'programme', menu: 'Programme', html: `
    ${head('Le programme', (SI.programme.titre || 'Le déroulé'))}
    <div class="paper alt" style="--tilt:.4deg"><span class="in-border"></span>
      ${days.map(d => `<div class="day"><div class="day-h">${esc(d.jour)}</div>${d.items.map(k => { const m = C.moments[k], L = C.lieux[m.lieu];
        return `<div class="moment">${ico(m.dessin)}<div><h3>${esc(m.titre)}</h3>
          <div class="meta">${m.heure ? `<span class="time">${esc(m.heure)}</span>` : soon('horaire à venir')}${ext(L.maps, esc(L.nom))}</div>
          ${m.texte ? `<p>${esc(m.texte)}</p>` : ''}</div></div>`; }).join('')}</div>`).join('')}
    </div>
    <div class="btns">
      ${perso ? `<a class="btn" href="agenda/${encodeURIComponent(code)}.ics">${ICON_CAL} iPhone, Mac, Outlook</a>` : ''}
      <a class="btn ghost" href="${esc(gcal())}" target="_blank" rel="noopener">${ICON_CAL} Google Agenda</a>
    </div>
    <div class="grid">${lieuxUsed.map(k => { const L = C.lieux[k];
      return `<div class="place"><div class="art">${C.illustrationsLieux !== false ? `<img src="photos/lieux/${k}.webp" alt="${esc(L.nom)}" loading="lazy">` : S[k]}</div>
        <h3>${esc(L.nom)}</h3><div class="addr">${esc(L.adresse)}</div>
        <div class="links">${ext(L.maps, 'Google Maps')}${ext('https://waze.com/ul?navigate=yes&q=' + encodeURIComponent(L.nom + ' ' + L.adresse), 'Waze')}</div></div>`; }).join('')}
    </div>` });

  /* --- Venir --- */
  if (on(SI.venir)) { const V = SI.venir, cv = V.covoiturage || {};
    const row = (k, titre, txt, extra) => txt === null || txt === undefined ? '' : `<li>${picto(k)}<div><b>${titre}</b><p>${txt ? esc(txt) : soon()}${extra || ''}</p></div></li>`;
    sections.push({ id: 'venir', menu: 'Venir', html: `
    ${head('Accès', V.titre || 'Venir jusqu’à nous')}
    <div class="paper" style="--tilt:-.3deg"><span class="in-border"></span><ul class="infos">
      ${row('voiture', 'En voiture', V.voiture)}
      ${row('parking', 'Se garer', V.parking)}
      ${row('train', 'En train', V.train)}
      ${row('navette', 'Navette', V.navette)}
      ${V.covoiturage && cv.lien ? row('covoiturage', 'Covoiturage', cv.texte || '', `<br><a class="btn ghost" href="${esc(cv.lien)}" target="_blank" rel="noopener">Proposer ou trouver une place</a>`) : ''}
    </ul></div>
    ${V.covoiturage && !cv.lien ? `
    <div class="paper alt covoit" id="covoiturage" style="--tilt:.3deg"><span class="in-border"></span>
      <div class="cv-head">${picto('covoiturage')}<h3>Covoiturage</h3></div>
      <p class="lead" style="margin:8px auto 18px">${esc(cv.texte || '')}</p>
      <div class="cv-list" id="cvList" aria-live="polite"><p class="note">Chargement des annonces…</p></div>
      <div class="btns"><button class="btn" type="button" id="cvAdd">Publier une annonce</button></div>
      <form class="form" id="cvForm" hidden autocomplete="on">
        <div class="seg" role="radiogroup" aria-label="Type d’annonce">
          <label><input type="radio" name="type" value="propose" checked><span>Je propose des places</span></label>
          <label><input type="radio" name="type" value="cherche"><span>Je cherche une place</span></label>
        </div>
        <label>Prénom<input type="text" id="cvNom" name="nom" maxlength="60" required value="${esc(nom || (store.get('rsvp.' + code) || {}).nom || '')}"></label>
        <label>Ville de départ<input type="text" id="cvDepart" name="depart" maxlength="60" required placeholder="Paris 15e, Orléans…"></label>
        <div class="row2">
          <label>Jour<select id="cvJour" name="jour">${days.map(d => `<option>${esc(d.jour)}</option>`).join('')}${days.length > 1 ? '<option>Tout le week-end</option>' : ''}</select></label>
          <label>Places<input type="number" id="cvPlaces" name="places" min="1" max="8" value="1" required></label>
        </div>
        <label>Pour vous joindre<input type="text" id="cvContact" name="contact" maxlength="80" required placeholder="06… ou e-mail"></label>
        <label>Un mot (facultatif)<input type="text" id="cvMot" name="message" maxlength="140" placeholder="Départ vers 13h, retour dimanche…"></label>
        <input class="hp" name="website" tabindex="-1" aria-hidden="true">
        <p class="note" style="margin:0">Votre prénom, votre ville et votre contact seront visibles par les autres invités. Vous pourrez retirer l’annonce depuis ce téléphone.</p>
        <button class="btn" type="submit">Publier</button>
      </form>
      <p class="msg" id="cvMsg" aria-live="polite"></p>
    </div>` : ''}` }); }

  /* --- Dormir --- */
  /* « Où dormir » : seulement pour les faire-parts qui ont des nuits (pas pour « Église & vin d’honneur ») */
  if (on(SI.dormir) && F.nuits.length) { const D = SI.dormir, adr = D.adresses || [];
    sections.push({ id: 'dormir', menu: 'Dormir', html: `
    ${head('Hébergement', D.titre || 'Où dormir')}
    ${F.nuits.length ? `<div class="paper stay" style="--tilt:.3deg"><span class="in-border"></span>
      ${ico('window')}<h3>${esc(H.titre || 'Dormir sur place')}</h3>
      <p class="lead" style="margin:8px auto 0">${esc(H.texte || '')}</p>
      ${C.prixNuit ? `<div class="prix">${esc(C.prixNuit)} €<small>par personne et par nuit</small></div>` : ''}
      <p class="muted" style="margin:10px 0 0;font-size:15.5px">${F.nuits.map(n => esc(n.label)).join(' · ')}</p>
      ${H.note ? `<p class="note">${esc(H.note)}</p>` : ''}
      <a class="btn" href="${esc(lienFP)}">Je le précise dans ma réponse</a></div>` : ''}
    <p class="lead" style="margin-top:${F.nuits.length ? 40 : 0}px">${esc(D.autour || '')}</p>
    ${adr.length ? `<div class="grid">${adr.map((a, i) => `<div class="paper adr${i % 2 ? ' alt' : ''}" style="--tilt:${i % 2 ? .5 : -.4}deg"><span class="in-border"></span>
        <div class="type">${esc(a.type || '')}${a.distance ? ' · ' + esc(a.distance) : ''}</div><h3>${esc(a.nom)}</h3>
        ${a.texte ? `<p>${esc(a.texte)}</p>` : ''}${a.lien ? `<div class="links" style="justify-content:flex-start">${ext(a.lien, 'Voir l’adresse →')}</div>` : ''}</div>`).join('')}</div>`
      : soon('adresses à venir')}` }); }

  /* --- Dress code : exactement la carte du faire-part (dresscode.js) --- */
  if (on(SI.dressCode) && window.DressCode) sections.push({ id: 'dress-code', menu: 'Dress code', html: `
    <div class="eyebrow" style="margin-bottom:22px">Tenue</div>
    ${DressCode.html()}` });

  /* --- FAQ --- */
  if (on(SI.faq)) { const Q = (SI.faq.questions || []).filter(x => x.q && x.r);
    sections.push({ id: 'questions', menu: 'Questions', html: `
    ${head('Bon à savoir', SI.faq.titre || 'Vos questions')}
    ${Q.length ? `<div class="faq">${Q.map(x => `<details><summary>${esc(x.q)}</summary><p>${esc(x.r)}</p></details>`).join('')}</div>` : soon()}` }); }

  /* --- Liste de mariage --- */
  const B = (C.bientot || [])[0];
  if (on(SI.liste) && B) sections.push({ id: 'liste', menu: 'Liste', html: `
    ${head('Cadeaux', B.titre || 'Liste de mariage')}
    <div class="paper carte fil" style="--tilt:.4deg"><span class="in-border"></span>${fili()}
      ${ico('gift')}<p class="accroche">${esc(B.accroche || '')}</p>
      ${B.texte ? `<p class="muted">${esc(B.texte)}</p>` : ''}
      ${B.lien ? `<a class="btn" href="${esc(B.lien)}" target="_blank" rel="noopener">Découvrir la liste</a>` : `<p style="margin:16px 0 0">${soon('bientôt en ligne')}</p>`}
    </div>` });

  /* --- Témoins --- */
  if (on(SI.temoins)) { const T = SI.temoins, P = T.personnes || [];
    sections.push({ id: 'temoins', menu: 'Témoins', html: `
    ${head('Surprises & discours', T.titre || 'Les témoins')}
    <p class="lead">${esc(T.texte || '')}</p>
    ${P.length ? `<div class="grid">${P.map((p, i) => `<div class="paper temoin${i % 2 ? ' alt' : ''}" style="--tilt:${i % 2 ? .5 : -.5}deg"><span class="in-border"></span>
        <h3>${esc(p.nom)}</h3><div class="role">${esc(p.role || '')}</div>
        <div class="links">${p.tel ? `<a href="tel:${esc(String(p.tel).replace(/[^\d+]/g, ''))}">Appeler</a><a href="sms:${esc(String(p.tel).replace(/[^\d+]/g, ''))}">SMS</a>` : ''}${p.email ? `<a href="mailto:${esc(p.email)}">E-mail</a>` : ''}</div></div>`).join('')}</div>` : soon('contacts à venir')}` }); }

  /* --- Playlist --- */
  if (on(SI.playlist)) { const PL = SI.playlist;
    sections.push({ id: 'playlist', menu: 'Playlist', html: `
    ${head('En piste', PL.titre || 'La playlist')}
    <div class="paper carte alt" style="--tilt:-.3deg"><span class="in-border"></span>
      ${ico('bells')}<p class="lead" style="margin:4px auto 0">${esc(PL.texte || '')}</p>
      ${PL.lien ? `<a class="btn" href="${esc(PL.lien)}" target="_blank" rel="noopener">Ouvrir la playlist</a>` : `
      <form class="form" id="chansonForm" autocomplete="off">
        <label>Votre chanson<input type="text" name="chanson" maxlength="140" placeholder="Titre — artiste" required></label>
        <label>Votre prénom<input type="text" name="nom" maxlength="80" value="${esc(nom || (store.get('rsvp.' + code) || {}).nom || '')}"></label>
        <input class="hp" name="website" tabindex="-1" aria-hidden="true">
        <button class="btn" type="submit">Proposer</button>
        <p class="msg" id="chansonMsg" aria-live="polite"></p>
      </form>`}
    </div>` }); }

  /* --- Photos --- */
  if (on(SI.photos)) { const PH = SI.photos;
    sections.push({ id: 'photos', menu: 'Photos', html: `
    ${head('Souvenirs', PH.titre || 'Vos photos')}
    <div class="paper carte" style="--tilt:.3deg"><span class="in-border"></span>
      <p class="lead" style="margin:0 auto">${esc(PH.texte || '')}</p>
      <form class="form" id="photoForm">
        <label>Votre prénom<input type="text" name="nom" maxlength="80" value="${esc(store.get('photoNom') || nom || (store.get('rsvp.' + code) || {}).nom || '')}" placeholder="Pour savoir qui remercier"></label>
        <label class="drop" id="drop"><input type="file" id="photoInput" accept="image/*,video/*" multiple>
          <b>Choisir des photos</b><span>ou les glisser ici · vidéos jusqu’à ${esc(PH.videoMaxMo || 40)} Mo</span></label>
        <div class="bar" hidden><i></i></div>
        <ul class="files" id="photoList"></ul>
        <p class="msg" id="photoMsg" aria-live="polite"></p>
      </form>
      ${PH.album ? `<a class="btn ghost" href="${esc(PH.album)}" target="_blank" rel="noopener">Voir toutes les photos</a>` : ''}
    </div>` }); }

  /* --- Merci --- */
  if (on(SI.merci)) sections.push({ id: 'merci', menu: 'Merci', html: `
    ${head('Après la fête', SI.merci.titre || 'Merci')}
    <div class="paper carte alt fil"><span class="in-border"></span>${fili()}
      <p class="accroche">${esc(SI.merci.texte || 'Merci d’avoir fait de ce week-end un souvenir inoubliable.')}</p>
      <div class="chut" style="margin-top:10px">${esc(C.prenoms[0])} &amp; ${esc(C.prenoms[1])}</div></div>` });

  /* =====================================================================
     EN-TÊTE, SOMMAIRE, PIED DE PAGE
     ===================================================================== */
  const [a, b] = C.prenoms;
  const haut = SI.haut || 'chateau';
  const heroArt = haut === 'photo' && C.photoHero ? `<figure class="hero-art photo"><img src="${esc(C.photoHero)}" alt="${esc(a)} et ${esc(b)}"></figure>`
    : haut === 'monogramme' && C.monogrammeImage ? `<div class="hero-art mono"><img src="${esc(C.monogrammeImage)}" alt=""></div>`
    : `<div class="hero-art"><img src="photos/lieux/chateau.webp" alt="${esc(C.lieux.chateau.nom)}"></div>`;
  const coin = (C.ornements || {}).coin;
  const R = store.get('rsvp.' + code);
  const statut = R ? `<div class="paper statut alt"><span class="in-border"></span>
      <div class="big">${R.presence === 'Oui' ? 'Vous serez des nôtres' : 'Vous allez nous manquer'}</div>
      <p>Réponse envoyée${R.date ? ' le ' + new Date(R.date).toLocaleDateString('fr-FR') : ''}${R.nom ? ' par ' + esc(R.nom) : ''}.</p>
      <a class="btn ghost" href="${esc(lienFP)}">Modifier ma réponse</a></div>`
    : perso ? `<div class="paper statut alt"><span class="in-border"></span>
      <div class="big">Serez-vous des nôtres ?</div>
      ${C.repondreAvant ? `<p>Réponse souhaitée avant le ${esc(C.repondreAvant)}.</p>` : ''}
      <a class="btn" href="${esc(lienFP)}">Répondre au faire-part</a></div>` : '';

  $('#annonce').innerHTML = SI.annonce ? `<div class="annonce">${esc(SI.annonce)}</div>` : '';
  $('#app').innerHTML = `
  <header class="hero">
    <div class="hero-card paper"><span class="in-border"></span>
      ${C.monogrammeLettres ? `<div class="emboss" aria-hidden="true" style="--m:url('${esc(C.monogrammeLettres)}')"><i class="e1"></i><i class="e2"></i><i class="e3"></i></div>` : ''}
      ${fili()}
      ${coin && coin !== 'aucune' ? `<span class="coin"><img src="${esc(coin)}" alt=""></span>` : ''}
      <div class="seal">${seal('haut')}</div>
      <div class="eyebrow">${esc(SI.titre || 'Le carnet du mariage')}</div>
      ${heroArt}
      <h1 class="names">${esc(a)} <span class="amp">&amp;</span> ${esc(b)}</h1>
      <p class="dates">${esc(F.dates)}</p>
      ${perso ? `<p class="formule">${esc(F.nom)}</p>` : ''}
    </div>
    ${SI.intro ? `<p class="intro">${esc(SI.intro)}</p>` : ''}
    ${perso ? '' : '<p class="generic">Vous avez reçu un faire-part ? Ouvrez ce carnet depuis son lien : vous y verrez votre programme complet.</p>'}
    <div class="cd" id="cd" role="timer" aria-label="Compte à rebours">
      <div><b id="cdJ">–</b><span>jours</span></div><div><b id="cdH">–</b><span>heures</span></div><div><b id="cdM">–</b><span>minutes</span></div>
    </div>
    <div class="cd-lbl" id="cdLbl">avant le grand jour</div>
    ${statut}
  </header>

  ${SI.menu !== false && sections.length > 2 ? `<nav class="toc" aria-label="Sommaire"><ul>${sections.map(s => `<li><a href="#${s.id}">${esc(s.menu)}</a></li>`).join('')}</ul></nav>` : ''}

  ${sections.map(s => `${rule()}<section id="${s.id}" class="reveal">${s.html}</section>`).join('')}

  <footer>
    ${rule()}
    <div class="seal" style="margin-top:34px">${seal('bas')}</div>
    <div class="eyebrow">Avec toute notre impatience</div>
    <div class="sig">${esc(a)} &amp; ${esc(b)}</div>
    <div class="links">${perso ? `<a href="${esc(lienFP)}">Revoir le faire-part</a>` : ''}${SI.contact ? `<a href="mailto:${esc(SI.contact)}">Nous écrire</a>` : ''}</div>
  </footer>`;

  /* ---------- compte à rebours (heure du 1er moment, sinon heureParDefaut) ---------- */
  (function countdown() {
    const m = C.moments[F.moments[0]], day = F.moments.includes('mairie') ? C.dateCivil : C.dateMariage;
    const h = String(m.heure || C.heureParDefaut || '15:00').match(/(\d{1,2})\D?(\d{2})?/) || [0, 15, 0];
    const T = new Date(`${day}T${String(h[1]).padStart(2, '0')}:${String(h[2] || '00').padStart(2, '0')}:00+02:00`);
    const tick = () => {
      const t = Math.max(0, Math.floor((T - Date.now()) / 1000));
      $('#cdJ').textContent = Math.floor(t / 86400); $('#cdH').textContent = String(Math.floor(t % 86400 / 3600)).padStart(2, '0'); $('#cdM').textContent = String(Math.floor(t % 3600 / 60)).padStart(2, '0');
      if (!t) { $('#cd').hidden = true; $('#cdLbl').textContent = Date.now() - T < 3 * 864e5 ? 'C’est le grand jour !' : ''; }
    };
    tick(); setInterval(tick, 20000);
  })();

  if (window.DressCode && document.querySelector('#dress-code')) DressCode.init();

  /* ---------- apparition au défilement + sommaire actif ---------- */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    const links = [...document.querySelectorAll('.toc a')];
    const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(l => { const act = l.getAttribute('href') === '#' + e.target.id; l.classList.toggle('on', act); if (act && l.scrollIntoView) l.parentNode.parentNode.scrollTo({ left: l.offsetLeft - 40, behavior: 'smooth' }); }); }), { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('section[id]').forEach(s => spy.observe(s));
  } else document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));

  /* ---------- covoiturage : annonces dans l’onglet « Covoiturage » du Sheet ---------- */
  const cvBox = $('#cvList');
  if (cvBox) {
    const URL_ = (SI.photos && SI.photos.url) || BACKEND, DEMO_ = !URL_ || params.has('demo');
    const mine = () => store.get('cv') || {};
    let demoList = [];
    const show = list => {
      cvBox.innerHTML = list.length ? list.map(x => `<div class="cv"><div class="cv-top"><span class="tag ${x.type === 'cherche' ? 'cherche' : ''}">${x.type === 'cherche' ? 'Cherche' : 'Propose'} ${esc(x.places)} place${+x.places > 1 ? 's' : ''}</span><b>${esc(x.nom)}</b></div>
        <div class="meta2">Départ : ${esc(x.depart)} · ${esc(x.jour)}</div>${x.message ? `<div class="meta2">${esc(x.message)}</div>` : ''}
        <div class="contact">${esc(x.contact)}</div>${mine()[x.id] ? `<button class="retirer" type="button" data-id="${esc(x.id)}">Retirer mon annonce</button>` : ''}</div>`).join('')
        : '<p class="note" style="text-align:center">Pas encore d’annonce : lancez-vous !</p>';
    };
    const load = async () => {
      if (DEMO_) return show(demoList);
      try { const r = await (await fetch(URL_ + '?action=covoiturage')).json(); show(r.annonces || []); }
      catch (e) { cvBox.innerHTML = '<p class="note" style="text-align:center">Les annonces n’ont pas pu être chargées. Réessayez un peu plus tard.</p>'; }
    };
    load();
    const form = $('#cvForm'), msg = $('#cvMsg');
    $('#cvAdd').addEventListener('click', () => { form.hidden = !form.hidden; if (!form.hidden) $('#cvDepart').focus(); });
    form.addEventListener('submit', async e => {
      e.preventDefault(); if (form.website.value) return;
      const btn = form.querySelector('[type=submit]'); btn.disabled = true; msg.textContent = 'Publication…';
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), cle = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      const a = { action: 'covoiturage', id, cle, code, type: form.type.value, nom: form.nom.value.trim(), depart: form.depart.value.trim(), jour: form.jour.value, places: form.places.value, contact: form.contact.value.trim(), message: form.message.value.trim() };
      try {
        const r = DEMO_ ? (demoList.push(a), { ok: true }) : await post(a);
        if (!r.ok) throw 0;
        const m = mine(); m[id] = cle; store.set('cv', m);
        form.hidden = true; form.depart.value = ''; form.message.value = '';
        msg.textContent = 'Annonce publiée' + (DEMO_ ? ' (aperçu : rien n’a été envoyé)' : '') + '.'; load();
      } catch (x) { msg.textContent = 'La publication n’a pas abouti, réessayez un peu plus tard.'; }
      btn.disabled = false;
    });
    cvBox.addEventListener('click', async e => {
      const b = e.target.closest('.retirer'); if (!b) return;
      const id = b.dataset.id, m = mine(); b.disabled = true;
      try {
        if (DEMO_) demoList = demoList.filter(x => x.id !== id); else { const r = await post({ action: 'covoiturage-retirer', id, cle: m[id] }); if (!r.ok) throw 0; }
        delete m[id]; store.set('cv', m); msg.textContent = 'Annonce retirée.'; load();
      } catch (x) { b.disabled = false; msg.textContent = 'Le retrait n’a pas abouti, réessayez.'; }
    });
  }

  /* ---------- playlist : suggestion → onglet « Chansons » ---------- */
  const cf = $('#chansonForm');
  if (cf) cf.addEventListener('submit', async e => {
    e.preventDefault(); if (cf.website.value) return;
    const msg = $('#chansonMsg'), btn = cf.querySelector('button');
    btn.disabled = true; msg.textContent = 'Envoi…';
    try {
      const r = await post({ action: 'chanson', chanson: cf.chanson.value.trim(), nom: cf.nom.value.trim(), code });
      if (!r.ok) throw 0;
      msg.textContent = 'Merci ! On la garde précieusement' + (r.demo ? ' (aperçu : rien n’a été envoyé)' : '') + '.'; cf.chanson.value = '';
    } catch (x) { msg.textContent = 'L’envoi n’a pas abouti, réessayez un peu plus tard.'; }
    btn.disabled = false;
  });

  /* ---------- dépôt de photos → dossier Google Drive ---------- */
  const pf = $('#photoForm');
  if (pf) {
    const PH = SI.photos, input = $('#photoInput'), list = $('#photoList'), msg = $('#photoMsg'), bar = pf.querySelector('.bar'), drop = $('#drop');
    const MAX = +PH.tailleMax || 2400, VMAX = (+PH.videoMaxMo || 40) * 1e6;
    /* réduit les photos dans le navigateur (≈ 1 Mo au lieu de 5 à 12) */
    async function shrink(file) {
      if (!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type) || !window.createImageBitmap) return file;
      try {
        const bmp = await createImageBitmap(file), r = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
        if (r === 1 && file.type === 'image/jpeg' && file.size < 3e6) return file;
        const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * r); cv.height = Math.round(bmp.height * r);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        return await new Promise(res => cv.toBlob(bl => res(bl || file), 'image/jpeg', .86));
      } catch (e) { return file; }
    }
    const b64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    let busy = false;
    async function send(files) {
      if (busy || !files.length) return; busy = true;
      const qui = pf.nom.value.trim(); store.set('photoNom', qui);
      files = [...files]; let ok = 0, done = 0;
      list.innerHTML = files.map((f, i) => `<li id="pf${i}"><span>${esc(f.name)}</span><span>en attente</span></li>`).join('');
      bar.hidden = false; bar.firstElementChild.style.width = '4%'; msg.textContent = '';
      for (let i = 0; i < files.length; i++) {
        const f = files[i], st = $('#pf' + i).lastElementChild;
        try {
          if (/^video\//.test(f.type) && f.size > VMAX) throw new Error('vidéo trop lourde');
          if (!/^(image|video)\//.test(f.type)) throw new Error('format non pris en charge');
          st.textContent = 'préparation…';
          const blob = await shrink(f);
          st.textContent = 'envoi…';
          const nomFichier = blob === f ? f.name : f.name.replace(/\.\w+$/, '') + '.jpg';
          const r = await post({ action: 'photo', nom: qui, code, fichier: nomFichier, type: blob.type || f.type, data: await b64(blob) });
          if (!r.ok) throw new Error(r.error || 'refusé');
          st.textContent = '✓ reçue'; st.className = 'ok'; ok++;
        } catch (e) { st.textContent = '✗ ' + (e && e.message && e.message.length < 40 ? e.message : 'échec'); st.className = 'ko'; }
        done++; bar.firstElementChild.style.width = Math.round(done / files.length * 100) + '%';
      }
      msg.textContent = ok === files.length ? `Merci ! ${ok > 1 ? ok + ' photos bien arrivées' : 'Photo bien arrivée'}.` : `${ok} sur ${files.length} envoyée${ok > 1 ? 's' : ''} : réessayez celles en échec (le Wi-Fi peut aider).`;
      input.value = ''; busy = false;
    }
    input.addEventListener('change', () => send(input.files));
    ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => send(e.dataTransfer.files));
  }
})();
</script>
</body>
</html>
