# Publie le site sur GitHub Pages à chaque push sur main.
# Avant publication, chaque fichier local reçoit « ?v=<commit> » :
# les navigateurs rechargent automatiquement les fichiers modifiés (plus de vieux cache).
name: Déployer le faire-part

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionner les fichiers (anti-cache)
        run: |
          V="${GITHUB_SHA::8}"
          # scripts appelés par index.html : config.js?v=xxx, sketches.js?v=xxx
          sed -i -E "s/(config|sketches)\.js(\?v=[^\"]*)?\"/\1.js?v=$V\"/g" index.html
          # images et masques référencés dans config.js : 'photos/xxx.png' → 'photos/xxx.png?v=…'
          sed -i -E "s#'(photos/[^'?]+)'#'\1?v=$V'#g" config.js
          grep -n "js?v=" index.html

      - name: Préparer le dossier publié
        run: |
          mkdir _site
          cp -r index.html liens.html config.js sketches.js photos agenda _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
