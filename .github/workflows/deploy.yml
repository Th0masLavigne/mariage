# Publie le site sur GitHub Pages à chaque push sur main.
# Avant publication, chaque fichier local reçoit « ?v=<commit> » :
# les navigateurs rechargent automatiquement les fichiers modifiés (plus de vieux cache).
name: Déployer le faire-part

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Versionner les fichiers (anti-cache)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s/(config|sketches)\.js(\?v=[^\"]*)?\"/\1.js?v=$V\"/g" index.html
          sed -i -E "s#'(photos/[^'?]+)'#'\1?v=$V'#g" config.js
          grep -n "js?v=" index.html

      - name: Préparer le dossier publié
        run: |
          mkdir -p _site
          cp -r index.html liens.html config.js sketches.js photos agenda _site/
          ls -R _site | head -40

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
