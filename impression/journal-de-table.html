<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Journal de table</title>
<!-- polices intégrées (même fichier que le faire-part papier) -->
<link rel="stylesheet" href="polices.css">
<!-- dessin des points à relier (généré, ne pas modifier à la main) -->
<script src="journal-dessin.js"></script>
<!-- générateur de QR code (même fichier que le faire-part papier) -->
<script src="qrcode.js"></script>
<script>
/* =====================================================================
   JOURNAL DE TABLE — TOUT CE QUI SE MODIFIE EST ICI
   ---------------------------------------------------------------------
   1. Modifiez les textes ci-dessous, enregistrez.
   2. Rechargez la page dans Chrome (Cmd + R) pour voir le résultat.
   3. Bouton « Exporter en PDF » en haut (taille : celle du format choisi
      ci-dessous, marges : aucune, « Graphiques d’arrière-plan » cochés).
      Menu « Pages » en haut :
      • « Lecture » : une page après l'autre — pour envoyer à lire ET pour
        PayPerNews (l'imprimeur fait lui-même l'imposition).
      • « Livret à plier » : les pages côte à côte dans l'ordre d'impression
        (8|1, 2|7, 6|3, 4|5) — pour un test maison : imprimer recto verso,
        « retourner sur le bord court », mettre à l'échelle du papier (A3 ou A4
        paysage), empiler les feuilles et plier au milieu.
   Rappels :
   • apostrophe typographique ’ dans les textes (ou \' ).
   • un texte entre crochets [ … ] est un emplacement à remplir :
     il est surligné à l’écran (pas à l’impression).
   • un texte vide '' masque le bloc.
   • **gras** et *italique* fonctionnent dans tous les textes.
   ===================================================================== */
window.JOURNAL = {

  /* --- FORMAT D'IMPRESSION ------------------------------------------
     Changez simplement le mot ci-dessous (ou le menu « Format » en haut de la page) :
       'tabloid'    : 260 × 370 mm  (PayPerNews « Tabloïd »)
       'broadsheet' : 332 × 475 mm  (PayPerNews « Broadsheet »)
       'a4'         : 210 × 297 mm  (impression maison)
     La mise en page est dessinée en A4 puis agrandie d'un bloc.
     Règles PayPerNews respectées automatiquement : marge technique de 10 mm
     (pointillés rouges à l'écran), pas de fonds perdus ni de traits de coupe,
     nombre de pages multiple de 4, pages dans l'ordre de lecture.
     Images : un bandeau rouge prévient si l'une d'elles est sous 200 dpi.  */
  format: 'tabloid',

  /* --- EN-TÊTE (toutes les pages) ------------------------------------ */
  nom: 'La Gazette des Mariés',
  devise: 'Le seul quotidien où tout le monde finit par dire oui',
  edition: 'Édition spéciale · N° 1',
  date: 'Samedi 7 août 2027',
  lieu: 'Château de la Fontaine',
  prix: 'Prix : un sourire',
  monogramme: '../photos/monogramme-lettres.png',      // '' pour le masquer

  /* --- PAGE 1 : LA UNE ----------------------------------------------- */
  une: {
    surtitre: '[Surtitre — ex. Exclusif]',
    titre: '[Gros titre — ex. Ils ont dit oui !]',
    chapo: '[Chapeau : deux lignes qui résument l’article principal, ton faussement solennel.]',
    photo: '',                       // ex. '../photos/fiances.jpeg' ; vide → cadre « photo »
    cadragePhoto: '50% 40%',
    legende: '[Légende de la photo]',
    texte: [
      '[Premier paragraphe de l’article principal : la rencontre.]',
      '[Deuxième paragraphe : les premières années, les voyages.]',
      '[Troisième paragraphe : la demande à Milos.]'
    ]
  },

  /* Encadrés de la colonne de droite (autant que vous voulez) */
  encadres: [
    { titre: 'Au sommaire', texte: 'Page 2 — Le programme\nPage 3 — Le menu\nPages 4 à 7 — Les jeux\nPage 8 — Le mot de la fin' },
    { titre: 'Météo', texte: '[Ciel dégagé sur le parc, averses de confettis en fin de soirée.]' },
    { titre: 'Petites annonces', texte: '[Cherche partenaire de rock, niveau débutant accepté.]\n[Perdu : une chaussure de la mariée. Récompense.]' }
  ],

  /* Deux articles courts sous l’article principal */
  breves: [
    { titre: '[Titre de la brève 1]', texte: '[Texte de la brève : une anecdote sur Tiphaine.]' },
    { titre: '[Titre de la brève 2]', texte: '[Texte de la brève : une anecdote sur Thomas.]' }
  ],

  /* Bandeau en bas de la page 1 */
  bandeau: 'En pages 4 à 7 : mots fléchés, points à relier, labyrinthe et notre histoire — à faire ensemble !',

  /* --- PAGE 2 : LE PROGRAMME (comme le verso du faire-part complet) --
     icone : rings | moon | bells | glasses | plate | croissant | gift | window
     largeur : largeur de l'illustration en mm
     trajet : texte écrit le long de la route qui part de ce lieu        */
  programme: {
    surtitre: 'Itinéraire',
    titre: 'Le Tour des Mariés',
    chapo: 'Trois étapes, de Suresnes à Griselles, du premier « oui » au dernier croissant.',
    lieux: [
      { etape: '1re étape', nom: 'Hôtel de ville de Suresnes', adresse: '2 rue Carnot, 92150 Suresnes',
        image: '../photos/lieux/mairie.webp', largeur: 54, trajet: '',
        moments: [ { jour: 'Vendredi 6 août', heure: '14h45', titre: 'Mariage civil', icone: 'rings' } ] },
      { etape: '2e étape', nom: 'Église Saint-Martin d’Égreville', adresse: 'Égreville (77620), à deux pas du château',
        image: '../photos/lieux/eglise.webp', largeur: 50, trajet: '',
        moments: [ { jour: 'Samedi 7 août', heure: '14h00', titre: 'Cérémonie religieuse', icone: 'bells' } ] },
      { etape: 'Arrivée', nom: 'Château de la Fontaine', adresse: '41 Bois le Roi, 45210 Griselles',
        image: '../photos/lieux/chateau.webp', largeur: 84,
        moments: [ { jour: 'Samedi 7 août',   heure: '17h00', titre: 'Vin d’honneur',           icone: 'glasses' },
                   {                          heure: '19h30', titre: 'Dîner & soirée dansante', icone: 'plate' },
                   { jour: 'Dimanche 8 août', heure: '10h30', titre: 'Brunch',                  icone: 'croissant' } ] }
    ],
    voiture: '../photos/4l-profil.png',             // '' pour masquer la 4L
    voitureTroncon: 1                               // sur quelle route (1 = entre le 1er et le 2e lieu)
  },

  /* --- PAGE 3 : LE MENU --------------------------------------------- */
  menu: {
    surtitre: 'Gastronomie',
    titre: 'Au menu ce soir',
    chapo: '[Notre critique gastronomique a tout goûté en avant-première. Son verdict : on en reprendrait.]',
    plats: [
      { categorie: 'Mises en bouche', nom: '[Nom des mises en bouche]', description: '[Courte description]' },
      { categorie: 'Entrée',          nom: '[Nom de l’entrée]',         description: '[Courte description]' },
      { categorie: 'Plat',            nom: '[Nom du plat]',             description: '[Courte description]' },
      { categorie: 'Fromages',        nom: '[Plateau de fromages]',     description: '' },
      { categorie: 'Dessert',         nom: '[Nom du dessert]',          description: '[Courte description]' }
    ],
    /* frise entre le menu et les encadrés : le détail de la soirée ('' ou etapes: [] pour la masquer) */
    soiree: {
      titre: 'Ce soir, minute par minute',
      etapes: [
        { heure: '19h30',   texte: 'À table !' },
        { heure: '[22h00]', texte: '[Ouverture du bal]' },
        { heure: '[23h00]', texte: '[Le gâteau des mariés]' },
        { heure: '[…]',     texte: '[Piste de danse jusqu’au bout de la nuit]' },
        { heure: '10h30',   texte: 'Brunch au château (dimanche)' }
      ]
    },
    encadres: [
      { titre: 'La cave', texte: '[Champagne : …]\n[Vin blanc : …]\n[Vin rouge : …]' },
      { titre: 'Menus particuliers', texte: '[Végétarien, sans gluten, enfants : votre assiette a été préparée spécialement. Signalez-vous au service.]' }
    ]
  },

  /* --- PAGE 4 : LES MOTS FLÉCHÉS ------------------------------------ */
  jeux: {
    titre: 'Les mots fléchés des mariés',
    consigne: 'Interdit de sortir son téléphone : interrogez vos voisins de table ! Les cases numérotées forment le mot mystère.',

    /* Les définitions : 'grille' → écrites dans les cases (vrais mots fléchés)
                         'liste'  → un numéro dans la case, les définitions sous la grille */
    definitions: 'grille',
    /* ajoute « (2 mots) » quand la réponse contient plusieurs mots */
    indiquerNbMots: true,

    /* Taille maximale de la grille (en cases, définitions comprises) */
    colonnesMax: 15,
    lignesMax: 16,

    /* La grille est construite automatiquement à partir des mots.
       Elle ne vous plaît pas ? Bouton « Autre grille » en haut de page,
       puis recopiez ici le numéro affiché pour la garder.               */
    graine: 26,

    /* Réponses : accents, espaces et apostrophes sont ignorés dans la grille.
       definition : le texte de la case (court : 3 à 6 mots).             */
    mots: [
      { reponse: 'Trampoline',      definition: 'Sport d’enfance de Tiphaine' },
      { reponse: 'BMX',             definition: 'Sport de Thomas' },
      { reponse: 'Salsa',           definition: 'Danse de Tiphaine' },
      { reponse: 'Milos',           definition: 'Île de la demande' },
      { reponse: 'Tarte au citron', definition: 'Gâteau préféré de Tiphaine' },
      { reponse: 'Vietnam',         definition: 'Leur plus grand voyage' },
      { reponse: 'Una',             definition: 'Le nom de leur chat.' },
      { reponse: 'Vingt',           definition: 'Années d’études post-bac des deux docteurs, cumulées' },
      { reponse: 'Grey’s Anatomy',  definition: 'Série de Tiphaine' },
      { reponse: 'ENS',             definition: 'École de Thomas' },
      { reponse: 'Trois',           definition: 'Niveau de plongée de Thomas' },
      { reponse: 'Bronze',          definition: 'Dernière étoile de ski de Tiphaine' },
      { reponse: 'Fraisier',        definition: 'Gâteau d’anniversaire de Thomas' },
      { reponse: 'Simpsons',        definition: 'Dessin animé de Thomas' },
      { reponse: 'Guitare',         definition: 'Instrument de Thomas' },
      { reponse: 'Suresnes',        definition: 'La ville où ils habitent' },
      /* mots « bonus » : ils apportent le H et le D de THAÏLANDE */
      { reponse: 'Champagne',       definition: 'Il coulera à flots ce soir' },
      { reponse: 'Docteurs',        definition: 'Leur titre à tous les deux' }
    ],

    motMystere: {
      mot: 'Thaïlande',
      question: 'Le mot mystère : [la destination rêvée de notre voyage de noces ?]'
    },

    piedDePage: '[Solution auprès des mariés… contre un pas de danse.]'
  },

  /* --- PAGE 5 : POINTS À RELIER ------------------------------------- */
  points: {
    titre: 'Les points à relier',
    consigne: 'Reliez les points dans l’ordre des numéros. Une étoile ★ marque le début d’un nouveau trait : levez le crayon et repartez de là.',
    question: 'Mais qui sont donc ces deux-là ?'
    /* le dessin lui-même est dans journal-dessin.js (généré à partir d’une photo) */
  },

  /* --- PAGES 5 ET 6 : LE MOT DES TÉMOINS (sous les jeux) ------------
     page : 5 (sous les points à relier) ou 6 (sous le labyrinthe)
     Un mot court (3 à 5 lignes) tient le mieux ; '' → le bloc disparaît. */
  temoins: [
    { page: 5, titre: 'Les témoins de Tiphaine ont la parole',
      mots: [ { nom: 'Clarisse',  texte: '[Le mot de Clarisse : un souvenir, une anecdote, un vœu pour les mariés.]' },
              { nom: 'Dominique', texte: '[Le mot de Dominique : un souvenir, une anecdote, un vœu pour les mariés.]' } ] },
    { page: 6, titre: 'Les témoins de Thomas ont la parole',
      mots: [ { nom: 'Bastien', texte: '[Le mot de Bastien : un souvenir, une anecdote, un vœu pour les mariés.]' },
              { nom: 'Antoine', texte: '[Le mot d’Antoine : un souvenir, une anecdote, un vœu pour les mariés.]' } ] }
  ],

  /* --- PAGE 6 : LE LABYRINTHE ---------------------------------------- */
  labyrinthe: {
    titre: 'Le labyrinthe',
    consigne: 'Aidez Thomas et son BMX à retrouver Tiphaine au cœur du labyrinthe… sans jamais traverser un mur !',
    depart: 'Thomas',
    arrivee: 'Tiphaine',
    largeur: 34,                  // nombre de couloirs en largeur (plus = plus difficile)
    salle: 7,                     // largeur (en couloirs) de la salle d'arrivée au centre du cœur
    graine: 1,                    // change le tracé
    piedDePage: ''
  },

  /* --- PAGE 7 : NOTRE HISTOIRE (en photos) --------------------------- */
  histoire: {
    titre: 'Notre histoire… dans le désordre',
    consigne: 'Retrouvez l’ordre de nos aventures : numérotez-les de 1 à {n}.',   // {n} = nombre d'étapes
    graine: 2,                    // change l'ordre de mélange
    /* Écrivez les étapes DANS LE BON ORDRE : la page les mélange toute seule.
       Ajouter une photo : copiez-la dans le dossier « photos », puis écrivez son nom
       après photo: (ex. '../photos/ma-photo.jpg'). Sans photo ('') → petit cadre orné.
       cadrage : la zone à garder entière, en % de la photo : 'gauche haut droite bas'
                 (ex. '30 20 70 60' = du 30e au 70e % en largeur, du 20e au 60e % en hauteur).
                 Prenez les deux visages, cheveux compris : la page centre cette zone dans
                 le carré ; si elle est trop haute, elle garde le haut (pas de tête coupée). */
    etapes: [
      { texte: 'Tonton et Tata jouent les entremetteurs *(photo non contractuelle)*', photo: '../photos/pont-neuf.jpg', cadrage: '4 29 92 100' },
      { texte: 'Premier week-end à deux, entre Giverny et La Roche-Guyon', photo: '../photos/roche-guyon.jpg',          cadrage: '36 18 62 55' },
      { texte: 'Première escapade, direction Bruges',                       photo: '../photos/bruges.jpg',               cadrage: '22 40 90 92' },
      { texte: 'Premier anniversaire ensemble',                             photo: '../photos/premier-anniversaire.jpg', cadrage: '8 20 87 85' },
      { texte: 'Rencontre avec Mamie à Saint-Raphaël',                      photo: '../photos/st_raph.jpeg',             cadrage: '18 8 67 78' },
      { texte: 'Une saison de festivals : Solidays et Rock en Seine',       photo: '../photos/solidays.jpeg',            cadrage: '13 13 63 85' },
      { texte: 'Premier Noël à trois (Una était déjà de la partie !)',      photo: '../photos/una-noel.jpg',             cadrage: '25 25 90 85' },
      { texte: 'Vacances au ski à l’Alpe d’Huez',                           photo: '../photos/alpe_dhuez.jpeg',          cadrage: '17 8 68 70' },
      { texte: 'Les Jeux de Paris 2024, dans les tribunes',                 photo: '../photos/jo-paris-2024.jpg',        cadrage: '28 20 78 50' },
      { texte: 'Les EDNs sont passés : dîner-croisière sur la Seine',       photo: '../photos/croisiere-edn.jpg',        cadrage: '22 24 75 56' },
      { texte: 'Thomas devient Docteur², Tiphaine devient médecin',         photo: '../photos/diplomes.jpeg',            cadrage: '28 18 70 78' },
      { texte: 'Le grand voyage au Vietnam',                                photo: '../photos/halong.jpg',               cadrage: '30 18 72 60' },
      { texte: 'Retour sur les pistes, au Lioran',                          photo: '../photos/lioran.jpeg',              cadrage: '23 8 87 68' },
      { texte: 'Découverte de Vienne et de Prague',                         photo: '../photos/prague.jpg',               cadrage: '10 18 83 82' },
      { texte: 'Week-end en famille à Arzon (Tiphaine a failli découvrir les plans !)', photo: '../photos/arzon.jpeg', cadrage: '13 28 87 68' },
      { texte: 'Voyage dans les Cyclades… et nous voilà fiancés !',         photo: '../photos/cyclades.jpg',             cadrage: '10 28 92 72' }
    ],
    piedDePage: '[Solutions de tous les jeux auprès des mariés… contre un pas de danse.]'
  },

  /* --- PAGE 8 : LE MOT DE LA FIN ------------------------------------- */
  fin: {
    surtitre: 'Le mot de la fin',
    titre: 'Merci !',
    photo: '../photos/milos.jpeg',   // photo en hauteur (portrait) ; '' → cadre « photo »
    cadragePhoto: '50% 60%',
    legende: '[Légende de la photo — ex. Milos, le soir de la demande]',
    texte: [
      '[Premier paragraphe : merci d’être venus, parfois de loin.]',
      '[Deuxième paragraphe : un mot pour les familles, les témoins, tous ceux qui ont aidé.]',
      '[Troisième paragraphe : rendez-vous sur la piste de danse !]'
    ],
    signature: 'Tiphaine & Thomas',
    encadres: [
      { titre: 'Demain matin', texte: 'Brunch au château à partir de **10h30**.\n[Café serré conseillé.]' }
    ],
    /* QR code du jour J vers le carnet, directement sur la partie « Vos photos ».
       Pas de code de formule dans le lien : chaque téléphone retrouve SON carnet
       (celui de son faire-part nominatif) ; un téléphone qui ne l'a jamais ouvert
       voit la partie commune. ⚠ Scannez le QR code imprimé avant de lancer l'impression.
       lien '' → pas de QR code */
    carnet: {
      titre: 'Vos photos de la soirée',
      texte: 'Flashez ce code : il ouvre votre carnet du mariage, à la page « Vos photos ». Déposez-y vos plus beaux clichés, ils arrivent directement dans notre album.',
      lien: 'https://th0maslavigne.github.io/mariage/site.html#photos'
    }
  }
};
</script>

<style>
:root{
  --encre:#2b3150; --bleu:#4a6a9c; --or:#b48a3c; --pale:#eef2f8; --papier:#fff;
  --f-display:'Bodoni Moda', Didot, serif; --f-body:'EB Garamond', Garamond, serif; --f-hand:'Parisienne', cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#d9d6cf}
body{font-family:var(--f-body);color:var(--encre);-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* barre d'outils (écran seulement) */
.outils{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--encre);color:#fff;font:14px/1.3 -apple-system,system-ui,sans-serif}
.outils button{font:inherit;padding:6px 12px;border:0;border-radius:6px;background:#fff;color:var(--encre);cursor:pointer}
.outils button.or{background:var(--or);color:#fff}
.outils .info{opacity:.85}
.alerte{background:#fde8e6;color:#8a1f12;padding:8px 16px;font:14px system-ui,sans-serif;border-bottom:1px solid #f0b4ab}
.alerte:empty{display:none}
.outils select{font:inherit;padding:4px 6px;border-radius:6px;border:0}
/* marge technique de l'imprimeur (écran seulement) */
.feuille{position:relative}
.feuille::after{content:"";position:absolute;outline:.25mm dashed rgba(220,0,0,.5);pointer-events:none;z-index:5}

.feuille{margin:10mm auto;background:var(--papier);box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:hidden}
.page{width:210mm;height:297mm;background:var(--papier);padding:11mm 12mm;transform-origin:0 0;
  display:flex;flex-direction:column;overflow:hidden;position:relative}
@media print{
  html{background:#fff} .outils,.alerte{display:none}
  .feuille{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .feuille::after{display:none}
  .ph{background:none!important;outline:none!important}
}
.ph{background:#fff4d6;outline:1px dashed var(--or);outline-offset:1px}
/* mode « livret à plier » : deux pages par planche, ordre d'imposition */
.planche{display:flex;margin:16mm auto 10mm;width:max-content;position:relative;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.planche .feuille{margin:0;box-shadow:none}
.planche::before{content:attr(data-titre);position:absolute;bottom:100%;left:0;padding-bottom:2mm;font:13px system-ui,sans-serif;color:#555}
.planche::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:.3mm dashed rgba(0,0,0,.35);z-index:6;pointer-events:none}
@media print{
  .planche{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .planche::before,.planche::after{display:none}
  .planche .feuille{break-after:auto;page-break-after:auto}
}

/* ---------- en-tête ---------- */
.filet-haut{display:flex;justify-content:space-between;align-items:center;font-size:3.4mm;letter-spacing:.06em;
  text-transform:uppercase;border-bottom:.3mm solid var(--encre);padding-bottom:1.5mm}
.titre-journal{display:flex;align-items:center;justify-content:center;gap:5mm;padding:3mm 0 1mm}
.titre-journal h1{font-family:var(--f-display);font-weight:800;font-size:13mm;line-height:1;letter-spacing:-.01em;text-align:center;white-space:nowrap}
.titre-journal img{height:15mm}
.devise{text-align:center;font-style:italic;font-size:4mm;padding-bottom:2mm}
.double-filet{border-top:.6mm solid var(--encre);border-bottom:.2mm solid var(--encre);height:1.6mm}
.mini-tete{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.6mm double var(--encre);padding-bottom:2mm}
.mini-tete b{font-family:var(--f-display);font-weight:800;font-size:7mm}
.mini-tete span{font-size:3.4mm;text-transform:uppercase;letter-spacing:.06em}

/* ---------- la une ---------- */
.surtitre{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.18em;font-size:3.3mm;color:var(--or);text-align:center;margin-top:4mm}
.gros-titre{font-family:var(--f-display);font-weight:700;font-size:12mm;line-height:1.05;text-align:center;margin:1.5mm 0 2mm}
.chapo{font-style:italic;font-size:4.6mm;line-height:1.3;text-align:center;max-width:160mm;margin:0 auto 4mm}
.corps{display:grid;grid-template-columns:2fr 1fr;gap:6mm;flex:1;min-height:0}
.principal{display:flex;flex-direction:column;gap:3mm;min-height:0}
.photo{height:62mm;background:var(--pale) center/cover no-repeat;border:.2mm solid var(--encre);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);letter-spacing:.2em;text-transform:uppercase;font-size:3mm;color:var(--bleu)}
.legende{font-size:3.2mm;font-style:italic;margin-top:-1.5mm}
.colonnes{columns:2;column-gap:5mm;column-rule:.2mm solid #c9cfdd;font-size:3.9mm;line-height:1.38;text-align:justify;hyphens:auto}
.colonnes p{margin-bottom:2mm} .colonnes p:first-child::first-letter{font-family:var(--f-display);font-weight:700;float:left;font-size:11mm;line-height:.85;padding:1mm 1.5mm 0 0}
.breves{display:grid;grid-template-columns:1fr 1fr;gap:5mm;border-top:.3mm solid var(--encre);padding-top:2.5mm;margin-top:auto}
.breves h3,.encadre h3{font-family:var(--f-display);font-weight:700;font-size:4.4mm;line-height:1.15;margin-bottom:1mm}
.breves p{font-size:3.7mm;line-height:1.35;text-align:justify;hyphens:auto}
.cote{border-left:.2mm solid #c9cfdd;padding-left:5mm;display:flex;flex-direction:column;gap:4mm}
.encadre{border-top:.6mm solid var(--encre);padding-top:2mm}
.encadre p{font-size:3.7mm;line-height:1.38;white-space:pre-line}

<body>
<div class="outils">
  <button class="or" onclick="window.print()">Exporter en PDF</button>
  <button onclick="basculerSolution()">Afficher / masquer la solution</button>
  <button onclick="autreGrille(-1)">← Grille précédente</button>
  <button onclick="autreGrille(1)">Autre grille →</button>
  <label>Format <select id="choixFormat" onchange="changerFormat(this.value)">
    <option value="tabloid">Tabloïd 260 × 370</option><option value="broadsheet">Broadsheet 332 × 475</option><option value="a4">A4 210 × 297</option></select></label>
  <label>Pages <select id="choixMise" onchange="changerMise(this.value)">
    <option value="lecture">Lecture (une après l’autre)</option><option value="livret">Livret à plier (imposition)</option></select></label>
  <span class="info" id="info"></span>
</div>
<div class="alerte" id="alerte"></div>
<div class="alerte" id="alerteFormat"></div>

<div class="feuille"><section class="page" id="p1"></section></div>
<div class="feuille"><section class="page" id="p2"></section></div>
<div class="feuille"><section class="page" id="p3"></section></div>
<div class="feuille"><section class="page" id="p4"></section></div>
<div class="feuille"><section class="page" id="p5"></section></div>
<div class="feuille"><section class="page" id="p6"></section></div>
<div class="feuille"><section class="page" id="p7"></section></div>
<div class="feuille"><section class="page" id="p8"></section></div>

<script>
/* =====================================================================
   MOTEUR — rien à modifier en dessous
   ===================================================================== */
const J = window.JOURNAL, JX = J.jeux;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* texte → HTML : **gras**, *italique*, [emplacement] surligné */
const fmt = s => esc(s || '').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')
                             .replace(/\[([^\]]*)\]/g,'<span class="ph">[$1]</span>');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');

/* ---------- format d'impression (tout est dessiné en A4 puis agrandi d'un bloc) ---------- */
const FORMATS = { tabloid: [260, 370], broadsheet: [332, 475], a4: [210, 297] };
const FORMAT = FORMATS[new URLSearchParams(location.search).get('format')] ? new URLSearchParams(location.search).get('format')
             : FORMATS[J.format] ? J.format : 'tabloid';
const [FL, FH] = FORMATS[FORMAT], ZOOM = FL / 210, MARGE_TECH = 10;
const LIVRET = new URLSearchParams(location.search).get('pages') === 'livret';
document.head.insertAdjacentHTML('beforeend', `<style>@page{size:${LIVRET ? 2 * FL : FL}mm ${FH}mm;margin:0}
  .feuille{width:${FL}mm;height:${FH}mm}
  .page{transform:scale(${ZOOM});height:${FH / ZOOM}mm}
  .feuille::after{inset:${MARGE_TECH}mm}</style>`);
function changerFormat(f){ const u = new URL(location.href); u.searchParams.set('format', f); location.href = u.href; }
function changerMise(m){ const u = new URL(location.href); u.searchParams.set('pages', m); location.href = u.href; }
/* livret à plier : planches de 2 pages, recto/verso, feuilles emboîtées (8|1, 2|7, 6|3, 4|5 pour 8 pages) */
function imposer(){
  $('#choixMise').value = LIVRET ? 'livret' : 'lecture';
  if (!LIVRET) return;
  const f = [...document.querySelectorAll('.feuille')], n = f.length;
  if (n % 4) return;
  const ancre = document.createComment('livret'); f[0].before(ancre);
  for (let s = 0; s < n / 4; s++) {
    [[n - 2 * s, 1 + 2 * s, 'recto'], [2 + 2 * s, n - 1 - 2 * s, 'verso']].forEach(([g, d, face]) => {
      const pl = document.createElement('div');
      pl.className = 'planche';
      pl.dataset.titre = `Feuille ${s + 1} · ${face} — pages ${g} | ${d}`;
      pl.append(f[g - 1], f[d - 1]);
      ancre.before(pl);
    });
  }
}
/* vérifications PayPerNews : pages multiple de 4, marge technique, images ≥ 200 dpi */
function verifierFormat(){
  const msgs = [], feuilles = document.querySelectorAll('.feuille');
  if (feuilles.length % 4) msgs.push(`${feuilles.length} pages : il en faut un multiple de 4.`);
  const pad = Math.min(11, 12) * ZOOM;
  if (pad < MARGE_TECH) msgs.push('Marges inférieures à la marge technique de 10 mm.');
  const basses = new Set(), pxmm = 96 / 25.4 / ZOOM;   // px CSS (non agrandis) par mm imprimé
  const verif = (src, w, h, nw, nh, cover) => {         // w, h : taille affichée en px CSS
    if (!nw || !w) return;
    const k = cover ? Math.max(w / nw, h / nh) : w / nw;             // px CSS par pixel d'image
    const dpi = 25.4 / (k / pxmm) ; if (dpi < 200) basses.add(`${src.split('/').pop()} (${Math.round(dpi)} dpi)`);
  };
  const charge = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
  const taches = [];
  document.querySelectorAll('.page img').forEach(im => taches.push(charge(im.src).then(n => n && verif(im.src, im.offsetWidth, im.offsetHeight, n.naturalWidth, n.naturalHeight, false))));
  document.querySelectorAll('.page [style*="background-image"]').forEach(el => { const m = el.style.backgroundImage.match(/url\(["']?([^"')]+)/);
    if (m) taches.push(charge(m[1]).then(n => n && verif(m[1], el.offsetWidth, el.offsetHeight, n.naturalWidth, n.naturalHeight, true))); });
  Promise.all(taches).then(() => {
    if (basses.size) msgs.push('Images un peu justes pour l’impression (300 dpi conseillés) : ' + [...basses].join(', '));
    $('#alerteFormat').textContent = msgs.join('  ·  ');
  });
  $('#choixFormat').value = FORMAT;
}

/* en-tête des pages intérieures */
const miniTete = (n, rubrique = 'Jeux') => `<div class="mini-tete"><b>${fmt(J.nom)}</b><span>${fmt(J.date)} · Page ${n} · ${rubrique}</span></div>`;

/* ---------- page 1 ---------- */
function entete(){
  return `<div class="filet-haut"><span>${fmt(J.edition)}</span><span>${fmt(J.date)} · ${fmt(J.lieu)}</span><span>${fmt(J.prix)}</span></div>
    <div class="titre-journal">${J.monogramme?`<img src="${J.monogramme}" alt="">`:''}<h1>${fmt(J.nom)}</h1>${J.monogramme?`<img src="${J.monogramme}" alt="">`:''}</div>
    ${J.devise?`<div class="devise">${fmt(J.devise)}</div>`:''}<div class="double-filet"></div>`;
}
function page1(){
  const u = J.une;
  const photo = u.photo ? `<div class="photo" style="background-image:url('${u.photo}');background-position:${u.cadragePhoto||'50% 50%'}"></div>`
                        : `<div class="photo">Photo</div>`;
  $('#p1').innerHTML = entete() + `
    ${u.surtitre?`<div class="surtitre">${fmt(u.surtitre)}</div>`:''}
    <h2 class="gros-titre">${fmt(u.titre)}</h2>
    ${u.chapo?`<p class="chapo">${fmt(u.chapo)}</p>`:''}
    <div class="corps">
      <div class="principal">
        ${photo}${u.legende?`<div class="legende">${fmt(u.legende)}</div>`:''}
        <div class="colonnes">${(u.texte||[]).map(p=>`<p>${fmt(p)}</p>`).join('')}</div>
        ${(J.breves||[]).length?`<div class="breves">${J.breves.map(b=>`<div><h3>${fmt(b.titre)}</h3><p>${fmt(b.texte)}</p></div>`).join('')}</div>`:''}
      </div>
      <aside class="cote">${(J.encadres||[]).map(e=>`<div class="encadre"><h3>${fmt(e.titre)}</h3><p>${fmt(e.texte)}</p></div>`).join('')}</aside>
    </div>
    ${J.bandeau?`<div class="bandeau">${fmt(J.bandeau)}</div>`:''}`;
}

/* ---------- construction de la grille ---------- */
function alea(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIR = { A:[0,1], D:[1,0] };   // A = horizontal (flèche →), D = vertical (flèche ↓)

function construire(mots, maxC, maxL, rnd){
  const g = new Map(), K = (r,c) => r + ',' + c;
  let bb = null; const places = [];
  const etendre = (b, r, c) => b ? { r0:Math.min(b.r0,r), r1:Math.max(b.r1,r), c0:Math.min(b.c0,c), c1:Math.max(b.c1,c) } : { r0:r, r1:r, c0:c, c1:c };

  function evaluer(i, r, c, dir, premier){
    const w = mots[i].rep, [dr,dc] = DIR[dir];
    const cl = g.get(K(r-dr, c-dc));
    if (cl && (cl.t !== 'D' || cl[dir] != null)) return null;
    const ap = g.get(K(r+dr*w.length, c+dc*w.length));
    if (ap && ap.t === 'L') return null;
    let croise = 0, b = etendre(bb, r-dr, c-dc);
    for (let k = 0; k < w.length; k++){
      const rr = r+dr*k, cc = c+dc*k, x = g.get(K(rr,cc));
      if (x){ if (x.t !== 'L' || x.ch !== w[k] || x[dir] != null) return null; croise++; }
      else {
        const p1 = g.get(K(rr+dc, cc+dr)), p2 = g.get(K(rr-dc, cc-dr));
        if ((p1 && p1.t === 'L') || (p2 && p2.t === 'L')) return null;
      }
      b = etendre(b, rr, cc);
    }
    if (!premier && !croise) return null;
    const lc = b.c1-b.c0+1, ll = b.r1-b.r0+1;
    if (lc > maxC || ll > maxL) return null;
    const aire0 = bb ? (bb.c1-bb.c0+1)*(bb.r1-bb.r0+1) : 0;
    return { i, r, c, dir, b, score: croise*10 + (cl?4:0) - (lc*ll-aire0)*0.15 + rnd()*3 };
  }
  function poser(p){
    const w = mots[p.i].rep, [dr,dc] = DIR[p.dir], kc = K(p.r-dr, p.c-dc);
    const cl = g.get(kc) || { t:'D' }; cl[p.dir] = p.i; g.set(kc, cl);
    for (let k = 0; k < w.length; k++){
      const kk = K(p.r+dr*k, p.c+dc*k), x = g.get(kk) || { t:'L', ch:w[k] };
      x[p.dir] = p.i; g.set(kk, x);
    }
    bb = p.b; places.push(p);
  }

  let attente = mots.map((m,i)=>i).sort((a,b)=> (mots[b].rep.length + rnd()*4) - (mots[a].rep.length + rnd()*4));
  const premier = attente.shift();
  poser(evaluer(premier, 0, 1, rnd() < .5 ? 'A' : 'D', true));
  let progres = true;
  while (attente.length && progres){
    progres = false;
    for (const i of [...attente]){
      const w = mots[i].rep; let best = null;
      for (const [key, x] of g){
        if (x.t !== 'L') continue;
        const [r, c] = key.split(',').map(Number);
        for (let k = 0; k < w.length; k++){
          if (w[k] !== x.ch) continue;
          for (const dir of ['A','D']){
            if (x[dir] != null) continue;
            const [dr,dc] = DIR[dir], p = evaluer(i, r-dr*k, c-dc*k, dir);
            if (p && (!best || p.score > best.score)) best = p;
          }
        }
      }
      if (best){ poser(best); attente.splice(attente.indexOf(i), 1); progres = true; }
    }
  }
  const croisements = [...g.values()].filter(x => x.t==='L' && x.A!=null && x.D!=null).length;
  return { g, bb, places, manquants: attente, croisements, aire:(bb.c1-bb.c0+1)*(bb.r1-bb.r0+1) };
}

function meilleureGrille(mots, graine){
  const rnd = alea(graine * 7919 + 13); let best = null;
  /* 300 essais après la première grille complète (au plus 3000 au total) */
  let complets = 0;
  for (let essai = 0; essai < 3000 && complets < 300; essai++){
    const r = construire(mots, JX.colonnesMax, JX.lignesMax, rnd);
    if (!r.manquants.length) complets++;
    const note = r.manquants.length*1e6 + r.aire - r.croisements*6;
    if (!best || note < best.note) best = Object.assign(r, { note });
  }
  return best;
}

/* cases du mot mystère : une lettre par case, bien réparties */
function choisirMystere(G, mot, graine){
  const rnd = alea(graine + 99), pris = [], manque = [];
  const lettres = [...G.g].filter(([k,x]) => x.t==='L').map(([k,x]) => { const [r,c]=k.split(',').map(Number); return { k, r, c, ch:x.ch }; });
  for (const ch of mot){
    const cands = lettres.filter(l => l.ch===ch && !pris.some(p=>p&&p.k===l.k));
    if (!cands.length){ manque.push(ch); pris.push(null); continue; }
    let best = null, bs = -1;
    for (const l of cands){
      const d = pris.filter(Boolean).reduce((m,p)=>Math.min(m, Math.hypot(p.r-l.r, p.c-l.c)), 99) + rnd()*1.5;
      if (d > bs){ bs = d; best = l; }
    }
    pris.push(best);
  }
  return { cases: pris, manque };
}

  const mystIdx = new Map(); M.cases.forEach((l,i) => l && mystIdx.set(l.k, i+1));

    ${liste}
    ${motM?`<div class="mystere"><p>${fmt(JX.motMystere.question)}</p><div class="cases-myst">${[...motM].map((ch,i)=>`<div><span>${ch}</span><i>${i+1}</i></div>`).join('')}</div></div>`:''}

/* ---------- page 3 : points à relier ---------- */
function svgPoints(){
  const D = window.JOURNAL_DESSIN;
  if (!D) return '<p class="consigne">(fichier journal-dessin.js introuvable)</p>';
  const tous = D.chaines.flat(), R = D.w / 330, FS = D.w / 70, poses = [], obst = D.obstacles || [];
  let n = 0, dots = '', labels = '', traces = '';
  D.chaines.forEach(ch => {
    traces += `<polyline class="trace" points="${ch.map(p=>p.join(',')).join(' ')}"/>`;
    ch.forEach((p, i) => {
      n++;
      const txt = (i === 0 ? '★' : '') + n, prev = ch[i-1], next = ch[i+1];
      /* place le numéro là où il gêne le moins (loin des autres points et des traits voisins) */
      let best = null, bs = -1;
      for (let a = 0; a < 16; a++){
        const ang = a * Math.PI / 8, cx = Math.cos(ang), cy = Math.sin(ang);
        const off = R*2.2 + FS*0.35 + Math.abs(cx) * txt.length * FS * 0.3;
        const lx = p[0] + cx*off, ly = p[1] + cy*off;
        let s = 1e9;
        for (const q of tous) if (q !== p) s = Math.min(s, Math.hypot(q[0]-lx, q[1]-ly));
        for (const q of poses) s = Math.min(s, Math.hypot((q[0]-lx) * .6, q[1]-ly) * .9);   // numéros déjà placés
        for (const q of obst) s = Math.min(s, Math.hypot(q[0]-lx, q[1]-ly) * 1.1);          // traits du visage
        for (const q of [prev, next]) if (q){            // distance au segment voisin
          const vx = q[0]-p[0], vy = q[1]-p[1], t = Math.max(0, Math.min(1, ((lx-p[0])*vx + (ly-p[1])*vy) / (vx*vx+vy*vy)));
          s = Math.min(s, Math.hypot(p[0]+t*vx-lx, p[1]+t*vy-ly) * 0.8);
        }
        if (s > bs){ bs = s; best = [lx, ly]; }
      }
      poses.push(best);
      dots += `<circle cx="${p[0]}" cy="${p[1]}" r="${R}"/>`;
      labels += `<text x="${best[0].toFixed(1)}" y="${best[1].toFixed(1)}">${txt}</text>`;
    });
  });
  const m = FS * 3.5;
  return `<svg viewBox="${-m} ${-m} ${D.w+2*m} ${D.h+2*m}" xmlns="http://www.w3.org/2000/svg">
    <g fill="var(--encre)">${(D.details||[]).map(d=>`<path d="${d}" fill-rule="evenodd"/>`).join('')}</g>
    <g stroke="var(--encre)" stroke-linecap="round" stroke-linejoin="round">${(D.traits||[]).map(t=>
      `<path d="${t.d}" ${t.plein ? 'fill="var(--encre)" stroke="none"' : `fill="none" stroke-width="${t.e}"`}/>`).join('')}</g>
    ${traces}<g fill="var(--encre)">${dots}</g>
    <g font-family="EB Garamond, serif" font-size="${FS}" fill="var(--encre)" text-anchor="middle" dominant-baseline="central">${labels}</g></svg>`;
}
function melanger(liste, graine){
  const rnd = alea(graine * 31 + 7); let best = null, bs = 1e9;
  for (let essai = 0; essai < 60; essai++){
    const t = liste.map((x, i) => i);
    for (let i = t.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
    /* évite qu'une étape reste à sa place ou juste à côté de sa voisine */
    const s = t.reduce((a, v, i) => a + (v === i ? 3 : 0) + (i && Math.abs(v - t[i-1]) === 1 ? 1 : 0), 0);
    if (s < bs){ bs = s; best = t; }
  }
  return best;
}

/* ---------- page 6 : labyrinthe en cœur ---------- */
function labyrinthe(L){
  const N = L.largeur || 30, s = 2.32 / N, M = Math.ceil(2.32 / s), rnd = alea((L.graine || 1) * 977 + 3);
  const dans = (i, j) => { const x = -1.16 + (j + .5) * s, y = 1.27 - (i + .5) * s, a = x*x + y*y - 1; return a*a*a - x*x*y*y*y <= 0; };
  const ok = [...Array(M)].map((_, i) => [...Array(N)].map((_, j) => dans(i, j)));
  const V = [[-1,0],[0,1],[1,0],[0,-1]];                     // haut, droite, bas, gauche
  const est = (i, j) => i >= 0 && j >= 0 && i < M && j < N && ok[i][j];
  /* arrivée : une petite salle au centre du cœur (2 couloirs de haut), où l'on écrit le prénom */
  let ctr = null, bd = 1e9;
  for (let i = 0; i < M; i++) for (let j = 0; j < N; j++) if (ok[i][j]){
    const d = Math.hypot(-1.16 + (j+.5)*s, 1.27 - (i+.5)*s - .2); if (d < bd){ bd = d; ctr = [i, j]; } }
  const SW = L.salle || 7, sj0 = ctr[1] - Math.floor(SW / 2), sj1 = sj0 + SW - 1, si0 = ctr[0] - 1, si1 = ctr[0];
  for (let i = si0; i <= si1; i++) for (let j = sj0; j <= sj1; j++) ok[i][j] = false;      // la salle
  const but = [si1 + 1, ctr[1]];                                                           // case d'entrée, sous la salle
  /* creusement (parcours en profondeur aléatoire) depuis l'arrivée */
  const ouvert = new Set(), vu = new Set([but.join()]), pile = [but], pere = new Map();
  const K = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  while (pile.length){
    const [i, j] = pile[pile.length - 1];
    const v = V.map(([di, dj]) => [i+di, j+dj]).filter(([a, b]) => est(a, b) && !vu.has(a+','+b));
    if (!v.length){ pile.pop(); continue; }
    const [a, b] = v[Math.floor(rnd() * v.length)];
    ouvert.add(K(i+','+j, a+','+b)); vu.add(a+','+b); pere.set(a+','+b, i+','+j); pile.push([a, b]);
  }
  for (let i = 0; i < M; i++) for (let j = 0; j < N; j++) if (ok[i][j] && !vu.has(i+','+j)) ok[i][j] = false;  // îlots isolés
  /* départ : case du bord gauche/haut la plus éloignée de l'arrivée (en suivant les couloirs) */
  const prof = c => { let d = 0; while (pere.has(c)){ c = pere.get(c); d++; } return d; };
  let dep = null, side = null, dm = -1;
  for (let i = 0; i < M; i++) for (let j = 0; j < N; j++) if (ok[i][j] && j < N / 2){
    for (const k of [3, 0]){ const [di, dj] = V[k]; if (!est(i+di, j+dj)){ const d = prof(i+','+j); if (d > dm){ dm = d; dep = [i, j]; side = k; } } }
  }
  /* murs */
  let murs = '';
  const seg = (x1, y1, x2, y2) => murs += `M${x1} ${y1}L${x2} ${y2}`;
  for (let i = 0; i < M; i++) for (let j = 0; j < N; j++){
    if (!ok[i][j]) continue;
    V.forEach(([di, dj], k) => {
      const a = i + di, b = j + dj, voisin = est(a, b);
      if (voisin && (k === 0 || k === 3)) return;              // mur intérieur : tracé une seule fois
      if (voisin && ouvert.has(K(i+','+j, a+','+b))) return;
      if (!voisin && i === dep[0] && j === dep[1] && k === side) return;   // entrée
      if (i === but[0] && j === but[1] && k === 0) return;                  // porte de la salle
      if (k === 0) seg(j, i, j+1, i); if (k === 2) seg(j, i+1, j+1, i+1);
      if (k === 3) seg(j, i, j, i+1); if (k === 1) seg(j+1, i, j+1, i+1);
    });
  }
  /* solution */
  const chemin = []; let c = dep.join();
  while (c){ const [a, b] = c.split(',').map(Number); chemin.push(`${b+.5},${a+.5}`); c = pere.get(c); }
  const [di, dj] = V[side], ex = dep[1] + .5 + dj * 1.6, ey = dep[0] + .5 + di * 1.6;
  /* petit BMX dessiné (roue arrière, roue avant, cadre, guidon, selle) */
  const velo = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})" fill="none" stroke="var(--encre)" stroke-width="${.11 / k * .9}" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-.78" cy="0" r=".45"/><circle cx=".78" cy="0" r=".45"/>
      <circle cx="-.78" cy="0" r=".06" fill="var(--encre)"/><circle cx=".78" cy="0" r=".06" fill="var(--encre)"/>
      <path d="M-.78 0L-.02 .03L-.32 -.52ZM-.32 -.52L.48 -.6M-.02 .03L.52 -.38M.48 -.6L.78 0M.48 -.6L.4 -.86L.66 -.9M-.46 -.6L-.16 -.6"/>
      <circle cx="-.02" cy=".03" r=".1"/><path d="M-.02 .03L.1 .2" /></g>`;
  const lab = side === 3
    ? `${velo(ex - 2.2, ey + .1, .95)}<text x="${ex - 2.2}" y="${ey - 1.1}" text-anchor="middle">${fmt(L.depart)}</text><text x="${ex - .5}" y="${ey}" text-anchor="middle" dominant-baseline="central">→</text>`
    : `<text x="${ex - 1.5}" y="${ey - 1.55}" text-anchor="end" dominant-baseline="central">${fmt(L.depart)}</text>${velo(ex, ey - 1.25, 1)}<text x="${ex}" y="${ey + .2}" text-anchor="middle" font-size=".9" dominant-baseline="central">↓</text>`;
  chemin.push(`${but[1]+.5},${si1+.2}`);                                    // on entre dans la salle
  const sx = (sj0 + sj1 + 1) / 2, sy = si0 + 1;                            // centre de la salle
  return `<svg viewBox="-7 -4.5 ${N + 14} ${M + 6}" xmlns="http://www.w3.org/2000/svg">
    <polyline class="chemin" points="${dep[1]+.5+dj*1.2},${dep[0]+.5+di*1.2} ${chemin.join(' ')}"/>
    <path d="${murs}" fill="none" stroke="var(--encre)" stroke-width=".16" stroke-linecap="round"/>
    <g font-family="Bodoni Moda, serif" font-size="1.05" fill="var(--encre)">${lab}</g>
    <text x="${sx}" y="${sy - .05}" text-anchor="middle" dominant-baseline="central" font-family="Parisienne, cursive" font-size="1.25" fill="var(--or)">${esc(L.arrivee)}</text>
    <g fill="none" stroke="var(--or)" stroke-width=".07"><circle cx="${sx - .17}" cy="${sy + .62}" r=".2"/><circle cx="${sx + .17}" cy="${sy + .62}" r=".2"/></g></svg>`;
}

/* recadre chaque photo pour que la zone choisie (les visages) soit entière et centrée dans son cadre */
function cadrerPhotos(){
  document.querySelectorAll('[data-zone]').forEach(el => {
    const [x0, y0, x1, y1] = el.dataset.zone.split(/\s+/).map(v => v / 100);
    const src = el.style.backgroundImage.match(/url\(["']?([^"')]+)/)[1], im = new Image();
    im.onload = () => {
      const bw = el.clientWidth, bh = el.clientHeight, k = Math.max(bw / im.naturalWidth, bh / im.naturalHeight);
      const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
      const axe = (a0, a1, d, b) => {                        // décalage sur un axe
        let o = (a1 - a0) * d <= b ? b / 2 - (a0 + a1) / 2 * d   // la zone tient : on la centre
                                   : -a0 * d + b * .03;           // trop grande : on garde son début (le haut)
        return Math.min(0, Math.max(b - d, o));
      };
      el.style.backgroundPosition = `${axe(x0, x1, dw, bw)}px ${axe(y0, y1, dh, bh)}px`;
    };
    im.src = src;
  });
}

/* ---------- page 2 : le programme (comme le verso du faire-part) ---------- */
function pageProgramme(){
  const P = J.programme, W = 186, LIEUX = P.lieux;                       // W : largeur utile de la page (mm)
  const lieux = LIEUX.map((L, k) => {
    const droite = k % 2 === 1; let jour = '';
    const items = L.moments.map(m => { const j = m.jour && m.jour !== jour ? `<span class="jour">${fmt(m.jour)}</span>` : ''; if (m.jour) jour = m.jour;
      return `<li><img src="../photos/icones/${m.icone}.webp" alt=""><span>${j}<span class="quoi"><b>${fmt(m.heure)}</b> ${fmt(m.titre)}</span></span></li>`; }).join('');
    return `<div class="lieu-r${droite ? ' droite' : ''}"><img class="ill" src="${L.image}" style="width:${L.largeur || 50}mm" alt="">
      <div class="lieu-t">${L.etape ? `<div class="etape-l">${fmt(L.etape)}</div>` : ''}<h3>${fmt(L.nom)}</h3><div class="adr">${fmt(L.adresse)}</div><ul>${items}</ul></div></div>`;
  });
  /* route en pointillés entre deux illustrations (gauche → droite, puis droite → gauche…) */
  const route = k => {
    const a = LIEUX[k], b = LIEUX[k + 1], H = 22, versDroite = k % 2 === 0;
    const x0 = versDroite ? (a.largeur || 50) / 2 : W - (a.largeur || 50) / 2;
    const x3 = versDroite ? W - (b.largeur || 50) / 2 : (b.largeur || 50) / 2, xm = (x0 + x3) / 2;
    const cw = 27, ch = cw * 497 / 1135, auto = P.voiture && k === (P.voitureTroncon || 1) - 1;
    const img = auto ? `<image href="${versDroite ? P.voiture : P.voiture.replace('.png', '-d.png')}" x="${xm - cw / 2}" y="${H / 2 - ch * .85}" width="${cw}" height="${ch}"/>` : '';
    const tx = auto ? xm + (versDroite ? -cw / 2 - 3 : cw / 2 + 3) : xm + (versDroite ? -4 : 4);
    return `<svg class="route" viewBox="0 0 ${W} ${H}" style="height:${H}mm;overflow:visible">
      <path d="M${x0} 1 C ${x0} ${H * .8}, ${x3} ${H * .2}, ${x3} ${H - 1}" fill="none" stroke="var(--or)" stroke-width=".55" stroke-dasharray="1.4 1.3" stroke-linecap="round"/>
      <circle cx="${x0}" cy="1" r=".9" fill="var(--or)"/><circle cx="${x3}" cy="${H - 1}" r=".9" fill="var(--or)"/>${img}
      ${a.trajet ? `<text x="${tx}" y="${H / 2 + (auto ? 4.5 : -2)}" text-anchor="${versDroite ? 'end' : 'start'}" font-family="EB Garamond, serif" font-style="italic" font-size="3.4" fill="var(--encre)">${esc(a.trajet)}</text>` : ''}</svg>`;
  };
  $('#p2').innerHTML = miniTete(2, 'Programme') + `
    ${P.surtitre?`<div class="surtitre">${fmt(P.surtitre)}</div>`:''}
    <h2 class="gros-titre petit">${fmt(P.titre)}</h2>
    ${P.chapo?`<p class="chapo">${fmt(P.chapo)}</p>`:''}
    <div class="lieux">${lieux.map((l, k) => l + (k < lieux.length - 1 ? route(k) : '')).join('')}</div>`;
}

/* ---------- page 8 : le mot de la fin ---------- */
function qrSVG(texte, cote){
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(texte); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" style="width:${cote}mm;height:${cote}mm;flex:none" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="var(--encre)"/></svg>`;
}
function pageFin(){
  const F = J.fin, C = F.carnet || {};
  const photo = F.photo ? `<div class="photo portrait" style="background-image:url('${F.photo}');background-position:${F.cadragePhoto||'50% 50%'}"></div>`
                        : `<div class="photo portrait">Photo</div>`;
  const blocs = (F.encadres||[]).map(e=>`<div class="encadre"><h3>${fmt(e.titre)}</h3><p>${fmt(e.texte)}</p></div>`);
  if (C.lien) blocs.push(`<div class="encadre carnet"><div><h3>${fmt(C.titre)}</h3><p>${fmt(C.texte)}</p></div>${qrSVG(C.lien, 26)}</div>`);
  $('#p8').innerHTML = miniTete(8, 'Le mot de la fin') + `
    ${F.surtitre?`<div class="surtitre">${fmt(F.surtitre)}</div>`:''}
    <h2 class="merci">${fmt(F.titre)}</h2>
    <div class="fin-corps">
      <figure>${photo}${F.legende?`<figcaption class="legende">${fmt(F.legende)}</figcaption>`:''}</figure>
      <div class="fin-texte">${(F.texte||[]).map(p=>`<p>${fmt(p)}</p>`).join('')}
        ${F.signature?`<div class="signature">${fmt(F.signature)}</div>`:''}</div>
    </div>
    <div class="bas-encadres fin-bas" style="grid-template-columns:${blocs.length > 1 ? '1fr 1.6fr' : '1fr'}">${blocs.join('')}</div>
    ${J.monogramme?`<img class="cul-de-lampe" src="${J.monogramme}" alt="">`:''}`;
}
