    const yes = $('#yes'), no = $('#no'), zone = $('#zone'), taunt = $('#taunt');

    function flee() {
      const z = zone.getBoundingClientRect(), nb = no.getBoundingClientRect(), yb = yes.getBoundingClientRect();
      no.classList.add('flee');
      let x, y, k = 0;
      do {
        x = Math.random() * Math.max(0, z.width - nb.width);
        y = Math.random() * Math.max(0, z.height - nb.height - 34);
        k++;
      } while (k < 30 && x + z.left < yb.right + 12 && x + z.left + nb.width > yb.left - 12 && y + z.top < yb.bottom + 12 && y + z.top + nb.height > yb.top - 12);
      no.style.left = x + 'px'; no.style.top = y + 'px';
      no.textContent = C.fuite[tries] || 'Non';
      tries++;
      yes.style.setProperty('--grow', (1 + tries * 0.1).toFixed(2));
      taunt.textContent = ['Raté !', 'Presque…', 'Trop lent !', 'Hop !', 'Encore raté'][tries - 1] || '';
      if (tries >= C.fuite.length) {
        setTimeout(() => { no.textContent = C.nonFinal; taunt.textContent = 'D’accord, d’accord… vous pouvez cliquer.'; }, 700);
      }
    }
    const canFlee = () => tries < C.fuite.length && R.presence !== 'Non';
    no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && canFlee()) flee(); });
    no.addEventListener('click', e => {
      if (e.detail > 0 && canFlee()) { flee(); return; } /* clavier : jamais bloqué */
      choose('Non');
    });
    yes.addEventListener('click', () => { choose('Oui'); burst(yes); });
    if (R.presence) choose(R.presence, true);

    function choose(p, silent) {
      R.presence = p;
      yes.classList.toggle('sel', p === 'Oui'); no.classList.toggle('sel', p === 'Non');
      if (p === 'Non') { taunt.textContent = 'On vous embrassera quand même.'; }

    }

    function stepper(id, val, min) {
      return `<div class="stepper" data-st="${id}" data-min="${min}"><button type="button" data-d="-1" aria-label="moins">−</button><output id="${id}">${val}</output><button type="button" data-d="1" aria-label="plus">+</button></div>`;
    }

    function renderDetails() {
      const d = $('#details');
      if (R.presence === 'Non') {
        d.innerHTML = `<div class="more">
          <label class="fld"><span>Un petit mot pour nous ?</span><textarea id="message" placeholder="Nous penserons fort à vous…">${esc(R.message)}</textarea></label>

          ${coordsHtml(R)}
          <button class="submit" type="submit">Envoyer ma réponse</button>${window.Donnees ? Donnees.ligne() : ''}</div>`;
      } else {
        const multi = F.moments.length > 2;
        d.innerHTML = `<div class="more">
          <div class="row2">
            <div class="fld"><span>Adultes</span>${stepper('adultes', R.adultes, 1)}</div>
            <div class="fld"><span>Enfants</span>${stepper('enfants', R.enfants, 0)}</div>
          </div>
          ${multi ? `<div class="fld"><span>Vous serez là pour…</span><div class="checks">${F.moments.map(k => { const m = C.moments[k]; return `
            <label class="chk"><input type="checkbox" name="mom" value="${k}" ${R.moments.includes(k) ? 'checked' : ''}>${esc(m.titre)}<small>${esc(m.jour)}</small></label>`; }).join('')}</div></div>` : ''}
          ${F.nuits.length ? `<div class="sleep">
            <h3>Dormir sur place ?</h3>
            <p>${C.prixNuit} € par nuit et par personne, dans la limite des places au château. Plus d’informations à venir. Chambres partagées possibles.</p>
            <label class="chk" style="margin-top:12px"><input type="checkbox" id="couchage" ${R.couchage ? 'checked' : ''}>Oui, nous aimerions dormir au château</label>
            <div id="sleepMore" ${R.couchage ? '' : 'hidden'}>
              <div class="checks" style="margin-top:10px">${F.nuits.map(n => `<label class="chk"><input type="checkbox" name="nuit" value="${n.id}" ${R.nuits.includes(n.id) ? 'checked' : ''}>${esc(n.label)}</label>`).join('')}</div>
              <div class="fld"><span>Nombre de personnes</span>${stepper('nb_couchage', R.nb_couchage, 1)}</div>
              <label class="chk" style="margin-top:12px"><input type="checkbox" id="partage" ${R.partage ? 'checked' : ''}>Partager une chambre ne nous dérange pas</label>
              <div class="estimate" id="estimate"></div>
            </div>
          </div>` : ''}
          <label class="fld"><span>Allergies ou régime particulier (facultatif)</span><input id="regime" type="text" value="${esc(R.regime)}" placeholder="végétarien, sans gluten…"></label>
          <label class="consent"><input type="checkbox" id="regimeOk" ${R.regimeOk ? 'checked' : ''}> Si je signale une allergie ou un régime, j’accepte que cette information serve uniquement à préparer mon repas et soit transmise au traiteur.</label>
          <label class="fld"><span>La chanson qui vous fera danser</span><input id="chanson" type="text" value="${esc(R.chanson)}" placeholder="Titre – artiste"></label>
          <label class="fld"><span>Un mot pour les mariés</span><textarea id="message" placeholder="Conseils, blagues, déclarations…">${esc(R.message)}</textarea></label>
          <label class="fld"><span>E-mail (pour recevoir les infos à venir)</span><input id="email" type="email" value="${esc(R.email)}" autocomplete="email"></label>
          ${coordsHtml(R)}
          <button class="submit" type="submit">Confirmer notre venue</button>${window.Donnees ? Donnees.ligne() : ''}</div>`;
        d.querySelectorAll('.stepper').forEach(st => st.addEventListener('click', e => {
          const btn = e.target.closest('button'); if (!btn) return;
          const id = st.dataset.st, out = $('#' + id);
          R[id] = Math.max(+st.dataset.min, Math.min(20, R[id] + +btn.dataset.d));
          out.textContent = R[id];
          if (id !== 'nb_couchage' && R.nb_couchage < R.adultes + R.enfants && !R._nbTouched) { R.nb_couchage = R.adultes + R.enfants; const o = $('#nb_couchage'); if (o) o.textContent = R.nb_couchage; }
          if (id === 'nb_couchage') R._nbTouched = true;
          estimate();
        }));
        const cb = $('#couchage');
        if (cb) cb.addEventListener('change', () => { R.couchage = cb.checked; $('#sleepMore').hidden = !cb.checked; estimate(); });
        d.querySelectorAll('input[name=nuit]').forEach(i => i.addEventListener('change', () => { readChecks(); estimate(); }));
        estimate();
      }
    }
    function readChecks() {
      const moms = [...document.querySelectorAll('input[name=mom]')];
      if (moms.length) R.moments = moms.filter(i => i.checked).map(i => i.value);
      const nuits = [...document.querySelectorAll('input[name=nuit]')];
      if (nuits.length) R.nuits = nuits.filter(i => i.checked).map(i => i.value);
    }
    function estimate() {
      const el = $('#estimate'); if (!el) return;
      const n = R.nuits.length * R.nb_couchage * C.prixNuit;
      el.textContent = R.couchage && n ? `Estimation : ${R.nb_couchage} pers. × ${R.nuits.length} nuit${R.nuits.length > 1 ? 's' : ''} × ${C.prixNuit} € = ${n} €` : '';
    }

    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#err'); err.textContent = '';
      R.nom = $('#nom').value.trim();
      ['regime', 'chanson', 'message', 'email', 'telephone', 'adresse', 'cp', 'ville', 'pays'].forEach(k => { const el = $('#' + k); if (el) R[k] = el.value.trim(); });
      const p = $('#partage'); if (p) R.partage = p.checked;
      const rok = $('#regimeOk'); R.regimeOk = !!(rok && rok.checked);
      readChecks();
      if (!R.nom) { err.textContent = 'Indiquez vos prénoms et noms pour qu’on sache qui répond.'; $('#nom').focus(); return; }
      if (!R.presence) { err.textContent = 'Choisissez « On sera là ! » ou « Non ».'; return; }
      if (R.presence === 'Oui' && F.moments.length > 2 && !R.moments.length) { err.textContent = 'Cochez au moins un moment.'; return; }
      if (R.presence === 'Oui' && R.regime && !R.regimeOk) { err.textContent = 'Cochez la case sous « Allergies ou régime » pour que nous puissions transmettre l’information au traiteur, ou laissez le champ vide.'; $('#regimeOk').focus(); return; }
      if ($('[name=website]').value) return; /* robot */
      const btn = e.target.querySelector('.submit'); btn.disabled = true; btn.textContent = 'Envoi…';
      const id = store.get('id') || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
      store.set('id', id);
      const oui = R.presence === 'Oui';
      const payload = {
        id: id + '_' + state.code, formule: F.libelle || F.nom, code: state.code, lien_nom: state.nom,
        nom: R.nom, presence: R.presence,
        adultes: oui ? R.adultes : 0, enfants: oui ? R.enfants : 0,
        moments: oui ? (F.moments.length > 2 ? R.moments : F.moments).map(k => C.moments[k].titre).join(', ') : '',
        couchage: oui && R.couchage ? 'Oui' : 'Non',
        nuits: oui && R.couchage ? F.nuits.filter(n => R.nuits.includes(n.id)).map(n => n.label).join(', ') : '',
        nb_couchage: oui && R.couchage ? R.nb_couchage : 0,
        partage: oui && R.couchage ? (R.partage ? 'Oui' : 'Non') : '',
        estimation_eur: oui && R.couchage ? R.nuits.length * R.nb_couchage * C.prixNuit : 0,
        regime: oui ? R.regime : '', consentement_regime: oui && R.regime ? new Date().toISOString().slice(0, 10) : '', chanson: oui ? R.chanson : '', message: R.message, email: R.email,
        telephone: R.telephone, adresse: R.adresse, cp: R.cp, ville: R.ville, pays: R.pays
      };
      try {
        if (DEMO) await new Promise(r => setTimeout(r, 700));
        else await fetch(C.rsvpUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        const saved = Object.assign({}, R, { date: new Date().toISOString() });
        store.set('rsvp.' + state.code, saved);
        delete box.dataset.edit;
        renderDone(F, saved);
      } catch (x) {
        btn.disabled = false; btn.textContent = 'Réessayer';
        err.textContent = 'L’envoi n’a pas abouti. Vérifiez votre connexion puis réessayez.';
      }
    });
  }

  function renderDone(F, R, already) {
    const box = $('#rsvpBox'), oui = R.presence === 'Oui';
    box.innerHTML = `<div class="done">
      ${S.doodle(oui ? 'glasses' : 'heart')}
      <div class="big">${oui ? 'C’est noté, on trinquera ensemble !' : 'Vous allez nous manquer.'}</div>
      <p>${oui ? 'Merci ' + esc(R.nom) + ' ! Nous vous enverrons les horaires, le code couleur et les infos pratiques très bientôt.' : 'Merci de nous avoir répondu, ' + esc(R.nom) + '. On lèvera un verre à votre santé.'}</p>
      ${already ? `<p class="deadline" style="margin:14px 0 0">Réponse envoyée${R.date ? ' le ' + new Date(R.date).toLocaleDateString('fr-FR') : ''}${DEMO ? ' (aperçu : rien n’a été envoyé)' : ''}</p>` : (DEMO ? '<p class="deadline" style="margin:14px 0 0">Mode aperçu : rien n’a été envoyé.</p>' : '')}
      ${C.site && C.site.lienFairePart ? `<a class="site-link" href="${carnetUrl()}">Le carnet pratique : accès, hébergement, covoiturage →</a><br>` : ''}
      ${oui && lienListe((C.bientot[0] || {}).lien) ? `<a class="site-link" href="${esc(lienListe(C.bientot[0].lien))}">Notre liste de mariage →</a><br>` : ''}
      <button class="linkbtn" id="edit" type="button">Modifier ma réponse</button></div>`;
    $('#edit').addEventListener('click', () => { box.dataset.edit = '1'; renderRSVP(F); });
    if (oui && !already) confetti();
  }

  /* ---------------- confettis ---------------- */
  function burst(el) {
    const b = el.getBoundingClientRect();
    confetti(b.left + b.width / 2, b.top + b.height / 2, 60);
  }
  function confetti(x, y, n) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'); cv.hidden = false;
    const ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = PAL === 'bleu' || PAL === 'vieux-rose' ? ['#b4476a', '#e39a6f', '#f7c6d4', '#c0607f', '#e9d5f5', '#f3a9bf'] : ['#c9a24a', '#f6e2a6', '#4a6a9c', '#9fbadb', '#fffdf8', '#8fb07f'];
    const P = Array.from({ length: n || 160 }, () => ({
      x: x != null ? x : innerWidth / 2 + (Math.random() - .5) * innerWidth * .6, y: y != null ? y : innerHeight * .35,
      vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: 4 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      c: cols[Math.floor(Math.random() * cols.length)], s: Math.random() < .5
    }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        if (p.s) { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .45, 0, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      });
      if (++t < 150) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })();
  }

  /* ---------------- enveloppe ---------------- */
  function envelope() {
    const F = C.formules[state.code];
    $('#envSeal').innerHTML = sealAt('enveloppe');
    $('#env').classList.toggle('photo-seal', ((C.sceaux || {}).enveloppe === 'photo'));
    $('#envLetter').innerHTML = `${C.monogrammeLettres && ((C.sceaux || {}).carte || 'image') === 'image' ? `<img class="l-mono" src="${esc(C.monogrammeLettres)}" alt="">` : ''}<span class="l-eye">Vous êtes invités</span><span class="l-names">${esc(C.prenoms[0])}<i>&amp;</i>${esc(C.prenoms[1])}</span><span class="l-orn">${S.ornement()}</span><span class="l-date gold">${esc(F.dates)}</span><span class="l-place">${esc(C.lieux.chateau.nom)}</span>${C.illustrationsLieux !== false ? `<img class="l-chateau" src="${AS('photos/lieux/chateau.webp')}" alt="">` : ''}<span class="fili tl">${S.filigrane()}</span><span class="fili tr">${S.filigrane()}</span><span class="fili bl">${S.filigrane()}</span><span class="fili br">${S.filigrane()}</span>`;
    const br = C.palette !== 'bleu' ? '<img class="branch" src="photos/branche-or.webp" alt="">' : S.branch(false);
    $('#doorL').innerHTML = br; $('#doorR').innerHTML = br;
    $('#envSprig').innerHTML = orn('branche'); $('#envSprig').className = 'sprig-env' + ornCls('branche'); $('#envRibbon').innerHTML = orn('ruban'); $('#envRibbon').className = 'ribbon-env' + ornCls('ruban');
    $('#envTo').textContent = state.nom ? (C.titreEnveloppeNom || 'Une invitation pour {nom}').replace('{nom}', nomInvites(state.nom)) : (C.titreEnveloppe == null ? 'Une invitation vous attend' : C.titreEnveloppe);
    $('#petals').innerHTML = Array.from({ length: PET('enveloppe') }, () =>
      `<i class="petal${Math.random() < .35 ? ' g' : ''}" style="left:${Math.random() * 100}%;animation-duration:${10 + Math.random() * 8}s;animation-delay:${-Math.random() * 12}s;transform:scale(${.6 + Math.random() * .8}) rotate(${Math.round(Math.random() * 360)}deg)"></i>`).join('');
    let opened = false, ready = false;
    /* la page est construite derrière l'enveloppe pendant qu'on la regarde, animations en pause :
       le clic n'a plus qu'à ouvrir les volets (sinon l'ouverture saccade) */
    const prep = () => { if (ready || opened) return; ready = true; NAME_DELAY = 2.9; $('#app').classList.add('paused'); render(); };
    setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(prep, { timeout: 1500 }) : prep()), 700);
    const open = () => {
      if (opened) return; opened = true; NAME_DELAY = 2.9;
      const env = $('#env');
      env.classList.add('open');
      $('#openBtn').style.opacity = '0'; $('#envTo').style.opacity = '0';
      setTimeout(() => env.classList.add('flapped'), 480);
      setTimeout(() => { const b = env.getBoundingClientRect(); petalBurst(b.left + b.width / 2, b.top + b.height * .45); }, 1000);
      if (!ready) { ready = true; render(); }
      $('#app').classList.remove('paused');
      fitTitles(); setTimeout(fitTitles, 3100);
      setTimeout(() => { $('#envelope').classList.add('gone'); scrollTo(0, 0); }, 3000);
      setTimeout(sakura, 7000); /* pétales de fond : après l'écriture des prénoms */
    };
    $('#env').addEventListener('click', open);
    $('#openBtn').addEventListener('click', open);
  }

  /* ---------------- barre d’aperçu ---------------- */
  function demoBar() {
    const bar = document.createElement('div'); bar.className = 'demo-bar';
    bar.innerHTML = `Aperçu
      <select id="dF" aria-label="Formule">${codes.map(k => `<option value="${k}" ${k === state.code ? 'selected' : ''}>${esc(C.formules[k].nom)}</option>`).join('')}</select>
      <select id="dS" aria-label="Style"><option value="sketch">Croquis</option><option value="placeholder">Photos à venir</option></select>`;
    document.body.appendChild(bar);
    $('#dS').value = state.style;
    $('#dF').addEventListener('change', e => { state.code = e.target.value; render(); scrollTo(0, 0); });
    $('#dS').addEventListener('change', e => { state.style = e.target.value; render(); });
  }

  if (DEMO) demoBar();
  if (!C.formules[state.code]) render(); else envelope();
  if (DEMO && !C.formules[state.code]) sakura();
})();
</script>
